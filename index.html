<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Epic ORB Launchpad</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; max-width: 750px; margin: 3rem auto; background: #1a1a1a; color: #fff; padding: 20px; border-radius: 10px;}
    h1 { color: #14F195; }
    .input-group { margin-bottom: 1rem; text-align: left; }
    .input-group label { display: block; margin-bottom: 0.5rem; font-size: 14px; color: #ccc; }
    .input-group input { width: 100%; padding: 10px; border-radius: 5px; border: 1px solid #333; background: #2a2a2a; color: #fff; box-sizing: border-box;}
    button { padding: 1rem 1.5rem; margin: 0.5rem 0; cursor: pointer; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; transition: 0.2s;}
    button:hover { opacity: 0.8; }
    button:disabled { background: #555; cursor: not-allowed; }
    #login-btn { background: #9945FF; color: white; width: 100%; }
    #create-launch-btn { background: #14F195; color: black; width: 100%; margin-top: 1rem;}
    #status { margin-top: 1.5rem; padding: 1rem; border-radius: 8px; font-size: 14px; word-break: break-all;}
    .success { background: #1e3a2b; color: #14F195; border: 1px solid #14F195; }
    .error { background: #3a1e1e; color: #ff6b6b; border: 1px solid #ff6b6b; }
    .info { background: #1e2a3a; color: #58a6ff; border: 1px solid #58a6ff; }
    #launch-form, #trade-section { display: none; }
    .section { background: #222; padding: 20px; border-radius: 10px; margin-top: 1.5rem; }
    .flex-row { display: flex; gap: 10px; }
    .flex-row > div { flex: 1; }
    .btn-buy { background: #14F195; color: #000; }
    .btn-sell { background: #ff6b6b; color: #fff; }
    .launch-card { background: #2a2a2a; border-radius: 8px; padding: 10px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
  </style>
</head>
<body>
  <h1>🚀 Epic ORB Launchpad</h1>
  <p>Lanza tu token con Bonding Curve o compra/vende tokens existentes.</p>

  <button id="login-btn">🔐 Conectar Wallet e Iniciar Sesión</button>

  <!-- SECCIÓN: CREAR LANZAMIENTO -->
  <div id="launch-form">
    <hr style="border-color: #333; margin: 1.5rem 0;">
    <h3>Crear Token (Bonding Curve)</h3>
    <div class="input-group">
      <label>Nombre del Token</label>
      <input type="text" id="token-name" placeholder="Ej: Epic ORB Token" value="Epic ORB Token">
    </div>
    <div class="input-group">
      <label>Símbolo</label>
      <input type="text" id="token-symbol" placeholder="Ej: EORB" value="EORB">
    </div>
    <div class="input-group">
      <label>Logo del Token (PNG/JPG)</label>
      <input type="file" id="logo-input" accept="image/png, image/jpeg">
    </div>
    <button id="create-launch-btn">✨ Crear Lanzamiento en Devnet</button>
  </div>

  <!-- SECCIÓN: COMPRAR / VENDER -->
  <div id="trade-section">
    <hr style="border-color: #333; margin: 1.5rem 0;">
    <h3>Comprar / Vender Tokens</h3>
    <div class="input-group">
      <label>Dirección del Lanzamiento (Genesis Account)</label>
      <input type="text" id="genesis-address" placeholder="Pega la dirección del lanzamiento..." style="width: 100%; padding: 10px; border-radius: 5px; border: 1px solid #333; background: #2a2a2a; color: #fff; box-sizing: border-box;">
    </div>
    <div class="flex-row">
      <div class="input-group">
        <label>Cantidad (SOL para comprar / Tokens para vender)</label>
        <input type="number" id="trade-amount" placeholder="0.1" step="0.01" value="0.1">
      </div>
      <div class="input-group">
        <label>Slippage (%)</label>
        <input type="number" id="slippage" value="1" min="0.1" max="50" step="0.1">
      </div>
    </div>
    <div class="flex-row">
      <button id="buy-btn" class="btn-buy" style="width: 50%;">🟢 Comprar</button>
      <button id="sell-btn" class="btn-sell" style="width: 50%;">🔴 Vender</button>
    </div>
  </div>

  <div id="status" class="info">Esperando conexión...</div>

  <script type="module">
    import { Buffer } from 'https://esm.sh/buffer@6.0.3';
    window.Buffer = Buffer;
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.39.3';
    import { createUmi } from 'https://esm.sh/@metaplex-foundation/umi-bundle-defaults@1.6.0';
    import { walletAdapterIdentity } from 'https://esm.sh/@metaplex-foundation/umi-signer-wallet-adapters@1.6.0';
    import { publicKey, sol } from 'https://esm.sh/@metaplex-foundation/umi@1.6.0';
    import { mplToolbox, createTokenIfMissing, findAssociatedTokenPda, transferSol, syncNative, closeToken } from 'https://esm.sh/@metaplex-foundation/mpl-toolbox@1.0.0';

    const SUPABASE_URL = 'https://zebmhlnqlkmwfgvfivmc.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_geHNN8tkjCA6BWmlMukJYQ_PFIpRAFB';
    const MI_DIRECCION_ORB = 'DeQ2hgNRnFTm1dDp9CKSdiGqbhMwoy2sjP6cqTkFWorb';

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const statusDiv = document.getElementById('status');
    const loginBtn = document.getElementById('login-btn');
    const launchForm = document.getElementById('launch-form');
    const tradeSection = document.getElementById('trade-section');
    const createBtn = document.getElementById('create-launch-btn');
    const buyBtn = document.getElementById('buy-btn');
    const sellBtn = document.getElementById('sell-btn');

    let umi = null;
    let provider = null;

    function showStatus(msg, type) {
      statusDiv.textContent = msg;
      statusDiv.className = type;
    }

    // --- PASO 1: AUTENTICACIÓN ---
    loginBtn.addEventListener('click', async () => {
      provider = window.phantom?.solana || window.solana;
      if (!provider || !provider.isPhantom) {
        return showStatus('Phantom no está instalado o no se detectó.', 'error');
      }
      
      try {
        showStatus('Conectando a Phantom...', 'info');
        await provider.connect();
        
        showStatus('Firmando mensaje seguro en Supabase...', 'info');
        const { data, error } = await supabase.auth.signInWithWeb3({
          chain: 'solana',
          statement: 'I accept the Terms of Service of Epic ORB Launchpad.',
          wallet: provider 
        });
        
        if (error) throw error;

        showStatus(`✅ Sesión iniciada. Wallet: ${data.user.user_metadata.custom_claims.iss}`, 'success');
        
        loginBtn.style.display = 'none';
        launchForm.style.display = 'block';
        tradeSection.style.display = 'block';

        showStatus('Iniciando motor de Solana...', 'info');
        
        umi = createUmi('https://api.devnet.solana.com');
        umi.use(walletAdapterIdentity(provider));
        umi.use(mplToolbox()); // Necesario para operaciones con tokens (wSOL)
        
        showStatus('✅ Todo listo. Configura tu token o tradea abajo.', 'success');
        
      } catch (err) {
        console.error(err);
        showStatus('Error: ' + (err.message || 'Rechazaste la firma.'), 'error');
      }
    });

    // --- PASO 2: CREAR LANZAMIENTO (BONDING CURVE) ---
    createBtn.addEventListener('click', async () => {
      if (!umi) return showStatus('Primero inicia sesión.', 'error');
      
      const fileInput = document.getElementById('logo-input');
      if (!fileInput.files.length) return showStatus('Selecciona un logo.', 'error');

      const tokenName = document.getElementById('token-name').value;
      const tokenSymbol = document.getElementById('token-symbol').value;

      createBtn.disabled = true;
      
      try {
        showStatus('⏳ Procesando imagen...', 'info');
        const file = fileInput.files[0];
        const reader = new FileReader();
        const fileBase64 = await new Promise((resolve, reject) => {
          reader.onload = (e) => resolve(e.target.result.split(',')[1]);
          reader.onerror = (e) => reject(e);
          reader.readAsDataURL(file);
        });

        showStatus('⏳ Subiendo logo a Irys (vía Supabase)...', 'info');
        const { data: uploadData, error: uploadError } = await supabase.functions.invoke('upload-to-irys', {
          body: { fileBase64, fileName: file.name, fileType: file.type }
        });

        if (uploadError) {
          let realErrorMessage = uploadError.message;
          try {
            const errorBody = await uploadError.context.json();
            if (errorBody && errorBody.error) realErrorMessage = errorBody.error;
          } catch (e) { /* fallback */ }
          throw new Error(realErrorMessage);
        }
        if (uploadData && uploadData.error) throw new Error(uploadData.error);
        
        const imageUrl = uploadData.url;
        showStatus('✅ Logo subido. Creando lanzamiento en Solana...', 'info');

        const { genesis, createAndRegisterLaunch } = await import('https://cdn.jsdelivr.net/npm/@metaplex-foundation/genesis@0.43.4/+esm');
        umi.use(genesis());

        // ✅ LAUNCHINPUT PARA BONDING CURVE
        const launchInput = {
          wallet: umi.identity.publicKey,
          network: 'solana-devnet',
          token: { name: tokenName, symbol: tokenSymbol, image: imageUrl },
          launchType: 'bondingCurve', // ✅ Tipo Bonding Curve
          launch: {}, // El SDK se encarga de los parámetros por defecto
        };

        const result = await createAndRegisterLaunch(umi, {}, launchInput);
        showStatus(`✅ ¡Lanzamiento creado! Genesis: ${result.genesisAddress || result.mintAddress}`, 'success');

        // Guardar en Supabase
        await supabase.from('launches').insert({
          authority: MI_DIRECCION_ORB,
          token_name: tokenName,
          token_symbol: tokenSymbol,
          token_image_url: imageUrl,
          raise_goal_sol: 0,
          deposit_start_time: new Date().toISOString(),
        });
        
        showStatus(`🚀 ¡Lanzamiento creado exitosamente! Usa la dirección de Genesis para tradear.`, 'success');
        
      } catch (err) {
        console.error(err);
        showStatus('Error al crear: ' + (err.message || 'Revisa la consola (F12).'), 'error');
      } finally {
        createBtn.disabled = false;
      }
    });

    // --- PASO 3: COMPRAR (SWAP) ---
    buyBtn.addEventListener('click', async () => {
      if (!umi) return showStatus('Primero inicia sesión.', 'error');
      
      const genesisAddress = document.getElementById('genesis-address').value.trim();
      const amountSol = parseFloat(document.getElementById('trade-amount').value);
      const slippageBps = parseFloat(document.getElementById('slippage').value) * 100; // 1% = 100 bps

      if (!genesisAddress) return showStatus('Ingresa la dirección de Genesis.', 'error');
      if (isNaN(amountSol) || amountSol <= 0) return showStatus('Cantidad inválida.', 'error');

      buyBtn.disabled = true;
      sellBtn.disabled = true;

      try {
        showStatus('⏳ Preparando compra...', 'info');
        
        const { 
          swapBondingCurveV2, getSwapResult, applySlippage, isSwappable, SwapDirection,
          findBondingCurveBucketV2Pda 
        } = await import('https://cdn.jsdelivr.net/npm/@metaplex-foundation/genesis@0.43.4/+esm');
        
        const genesisPubkey = publicKey(genesisAddress);
        
        // Derivar la cuenta de la curva (bucket)
        const [bucketPda] = findBondingCurveBucketV2Pda(umi, {
          genesisAccount: genesisPubkey,
          bucketIndex: 0,
        });

        const bucket = await umi.rpc.getAccount(bucketPda);
        if (!isSwappable(bucket)) {
          throw new Error("La curva no está activa para intercambios.");
        }

        const amountIn = BigInt(Math.floor(amountSol * 1_000_000_000)); // Lamports
        const quote = getSwapResult(bucket, amountIn, SwapDirection.Buy);
        const minAmountOut = applySlippage(quote.amountOut, slippageBps);

        showStatus('⏳ Envolviendo SOL a wSOL...', 'info');
        
        const WSOL = publicKey('So11111111111111111111111111111111111111112');
        const SPL_TOKEN = publicKey('TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA');
        const [userQuoteTokenAccount] = findAssociatedTokenPda(umi, { mint: WSOL, owner: umi.identity.publicKey });
        const [userBaseTokenAccount] = findAssociatedTokenPda(umi, { mint: quote.baseMint, owner: umi.identity.publicKey });

        // Envolver SOL
        const { transactionBuilder } = await import('https://esm.sh/@metaplex-foundation/umi@1.6.0');
        await transactionBuilder()
          .add(createTokenIfMissing(umi, { mint: WSOL, token: userQuoteTokenAccount, tokenProgram: SPL_TOKEN }))
          .add(transferSol(umi, { destination: userQuoteTokenAccount, amount: sol(amountSol) }))
          .add(syncNative(umi, { account: userQuoteTokenAccount }))
          .sendAndConfirm(umi);

        showStatus('⏳ Ejecutando compra...', 'info');

        await swapBondingCurveV2(umi, {
          genesisAccount: genesisPubkey,
          bucket: bucketPda,
          baseMint: quote.baseMint,
          quoteMint: WSOL,
          baseTokenAccount: userBaseTokenAccount,
          quoteTokenAccount: userQuoteTokenAccount,
          amount: quote.amountIn,
          minAmountOutScaled: minAmountOut,
          swapDirection: SwapDirection.Buy,
        }).sendAndConfirm(umi);

        showStatus(`✅ Compra exitosa. Recibiste tokens.`, 'success');

        // Desenvolver wSOL restante (opcional)
        try {
          await closeToken(umi, { account: userQuoteTokenAccount, destination: umi.identity.publicKey, owner: umi.identity }).sendAndConfirm(umi);
        } catch (e) { /* Si falla, no es crítico */ }

      } catch (err) {
        console.error(err);
        showStatus('Error al comprar: ' + (err.message || 'Revisa la consola.'), 'error');
      } finally {
        buyBtn.disabled = false;
        sellBtn.disabled = false;
      }
    });

    // --- PASO 4: VENDER (SWAP) ---
    sellBtn.addEventListener('click', async () => {
      if (!umi) return showStatus('Primero inicia sesión.', 'error');
      
      const genesisAddress = document.getElementById('genesis-address').value.trim();
      const amountTokens = parseFloat(document.getElementById('trade-amount').value);
      const slippageBps = parseFloat(document.getElementById('slippage').value) * 100;

      if (!genesisAddress) return showStatus('Ingresa la dirección de Genesis.', 'error');
      if (isNaN(amountTokens) || amountTokens <= 0) return showStatus('Cantidad inválida.', 'error');

      buyBtn.disabled = true;
      sellBtn.disabled = true;

      try {
        showStatus('⏳ Preparando venta...', 'info');
        
        const { 
          swapBondingCurveV2, getSwapResult, applySlippage, isSwappable, SwapDirection,
          findBondingCurveBucketV2Pda 
        } = await import('https://cdn.jsdelivr.net/npm/@metaplex-foundation/genesis@0.43.4/+esm');
        
        const genesisPubkey = publicKey(genesisAddress);
        
        const [bucketPda] = findBondingCurveBucketV2Pda(umi, {
          genesisAccount: genesisPubkey,
          bucketIndex: 0,
        });

        const bucket = await umi.rpc.getAccount(bucketPda);
        if (!isSwappable(bucket)) {
          throw new Error("La curva no está activa para intercambios.");
        }

        const amountIn = BigInt(Math.floor(amountTokens * 1_000_000_000)); // Asumiendo 9 decimales
        const quote = getSwapResult(bucket, amountIn, SwapDirection.Sell);
        const minAmountOut = applySlippage(quote.amountOut, slippageBps);

        showStatus('⏳ Ejecutando venta...', 'info');

        const WSOL = publicKey('So11111111111111111111111111111111111111112');
        const [userQuoteTokenAccount] = findAssociatedTokenPda(umi, { mint: WSOL, owner: umi.identity.publicKey });
        const [userBaseTokenAccount] = findAssociatedTokenPda(umi, { mint: quote.baseMint, owner: umi.identity.publicKey });

        await swapBondingCurveV2(umi, {
          genesisAccount: genesisPubkey,
          bucket: bucketPda,
          baseMint: quote.baseMint,
          quoteMint: WSOL,
          baseTokenAccount: userBaseTokenAccount,
          quoteTokenAccount: userQuoteTokenAccount,
          amount: quote.amountIn,
          minAmountOutScaled: minAmountOut,
          swapDirection: SwapDirection.Sell,
        }).sendAndConfirm(umi);

        showStatus(`✅ Venta exitosa. Recibiste SOL.`, 'success');

        // Desenvolver wSOL para obtener SOL nativo
        try {
          await closeToken(umi, { account: userQuoteTokenAccount, destination: umi.identity.publicKey, owner: umi.identity }).sendAndConfirm(umi);
        } catch (e) { /* Si falla, no es crítico */ }

      } catch (err) {
        console.error(err);
        showStatus('Error al vender: ' + (err.message || 'Revisa la consola.'), 'error');
      } finally {
        buyBtn.disabled = false;
        sellBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
