<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Epic ORB Launchpad</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; max-width: 650px; margin: 3rem auto; background: #1a1a1a; color: #fff; padding: 20px; border-radius: 10px;}
    h1 { color: #14F195; }
    button { padding: 1rem 1.5rem; margin: 0.5rem 0; cursor: pointer; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; transition: 0.2s;}
    button:hover { opacity: 0.8; }
    button:disabled { background: #555; cursor: not-allowed; }
    #login-btn { background: #9945FF; color: white; width: 100%; }
    #create-launch-btn { background: #14F195; color: black; width: 100%; }
    #status { margin-top: 1.5rem; padding: 1rem; border-radius: 8px; font-size: 14px; word-break: break-all;}
    .success { background: #1e3a2b; color: #14F195; border: 1px solid #14F195; }
    .error { background: #3a1e1e; color: #ff6b6b; border: 1px solid #ff6b6b; }
    .info { background: #1e2a3a; color: #58a6ff; border: 1px solid #58a6ff; }
  </style>
</head>
<body>
  <h1>🚀 Epic ORB Launchpad</h1>
  <p>Lanza tu token de forma justa y segura en Solana Devnet.</p>

  <button id="login-btn">🔐 Conectar Wallet e Iniciar Sesión</button>
  <button id="create-launch-btn" disabled>✨ Crear Lanzamiento en Devnet</button>

  <div id="status" class="info">Esperando conexión...</div>

  <script type="module">
    // 1. Polyfill para el Buffer (Vital para que Solana funcione en el navegador sin Node.js)
    import { Buffer } from 'https://esm.sh/buffer@6.0.3';
    window.Buffer = Buffer;

    // 2. Importar librerías
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
    import { createUmi } from 'https://esm.sh/@metaplex-foundation/umi-bundle-defaults';
    import { walletAdapterIdentity } from 'https://esm.sh/@metaplex-foundation/umi-signer-wallet-adapters';
    import { genesis, createAndRegisterLaunch } from 'https://esm.sh/@metaplex-foundation/genesis';

    // ⚠️ CONFIGURA TUS DATOS AQUÍ
    const SUPABASE_URL = 'TU_SUPABASE_URL';
    const SUPABASE_ANON_KEY = 'TU_SUPABASE_ANON_KEY';
    const MI_DIRECCION_ORB = 'DeQ2hgNRnFTmLdP9KCSd1gqbhMw2ysjP6cqtKFWorb'; // <-- Pon tu dirección ORB aquí

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const statusDiv = document.getElementById('status');
    const loginBtn = document.getElementById('login-btn');
    const createBtn = document.getElementById('create-launch-btn');

    let umi = null;
    let currentUser = null;

    function showStatus(msg, type) {
      statusDiv.textContent = msg;
      statusDiv.className = type;
    }

    // --- PASO 1: AUTENTICACIÓN ---
    loginBtn.addEventListener('click', async () => {
      if (!window.solana || !window.solana.isPhantom) {
        return showStatus('Instala Phantom Wallet para continuar.', 'error');
      }
      
      try {
        showStatus('Conectando a Phantom...', 'info');
        
        // Conectar Phantom
        await window.solana.connect();
        
        showStatus('Firmando mensaje seguro en Supabase...', 'info');
        
        // Autenticar en Supabase con Web3
        const { data, error } = await supabase.auth.signInWithWeb3({
          chain: 'solana',
          statement: 'Acepto los Términos de mi Launchpad ORB.',
        });
        
        if (error) throw error;

        currentUser = data.user;
        const walletAddress = currentUser.user_metadata.custom_claims.iss;
        
        showStatus(`✅ Sesión iniciada. Wallet conectada: ${walletAddress}`, 'success');
        loginBtn.disabled = true;
        createBtn.disabled = false;

        // Inicializar Umi (Metaplex) apuntando a Devnet
        umi = createUmi('https://api.devnet.solana.com');
        umi.use(walletAdapterIdentity(window.solana));
        umi.use(genesis());
        
      } catch (err) {
        console.error(err);
        showStatus('Error: ' + (err.message || 'Rechazaste la firma o hubo un problema.'), 'error');
      }
    });

    // --- PASO 2: CREAR EL LANZAMIENTO ---
    createBtn.addEventListener('click', async () => {
      if (!umi) return showStatus('Primero inicia sesión.', 'error');
      createBtn.disabled = true;
      showStatus('⏳ Creando lanzamiento en Devnet... (Confirma la transacción en Phantom)', 'info');

      // Configuración del lanzamiento
      const launchInput = {
        wallet: umi.identity.publicKey,
        launchType: 'launchpool',
        token: {
          name: 'Epic ORB Token',
          symbol: 'EORB',
          image: 'https://placehold.co/400x400/14F195/000000?text=ORB', // Cambia por tu logo real
        },
        launch: {
          launchpool: {
            tokenAllocation: 500_000_000, // 50% del supply
            depositStartTime: new Date(Date.now() + 3600_000), // Empieza en 1 hora
            raiseGoal: 10, // Meta de 10 SOL
            raydiumLiquidityBps: 5000, // 50% para liquidez
            fundsRecipient: MI_DIRECCION_ORB, 
          },
        },
      };

      try {
        const result = await createAndRegisterLaunch(umi, {}, launchInput);
        console.log('Resultado de Genesis:', result);
        
        showStatus(`✅ ¡Lanzamiento creado! Mint: ${result.mintAddress}`, 'success');

        // Guardar en Supabase
        showStatus('Guardando datos en la base de datos...', 'info');
        
        const { error: dbError } = await supabase.from('launches').insert({
          authority: MI_DIRECCION_ORB,
          token_name: launchInput.token.name,
          token_symbol: launchInput.token.symbol,
          token_image_url: launchInput.token.image,
          raise_goal_sol: launchInput.launch.launchpool.raiseGoal,
          deposit_start_time: launchInput.launch.launchpool.depositStartTime.toISOString(),
        });
        
        if (dbError) {
          console.error('Error en Supabase:', dbError);
          showStatus('Lanzamiento creado en Solana, pero falló el guardado en base de datos.', 'error');
        } else {
          showStatus('🚀 ¡Lanzamiento creado y guardado en Supabase exitosamente!', 'success');
        }
        
      } catch (err) {
        console.error(err);
        showStatus('Error al crear: ' + (err.message || 'Revisa la consola de tu navegador (F12).'), 'error');
      } finally {
        createBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
