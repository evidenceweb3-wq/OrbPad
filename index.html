<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Epic ORB Launchpad</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; max-width: 850px; margin: 3rem auto; background: #121212; color: #fff; padding: 20px; }
    h1 { color: #14F195; text-align: center; font-size: 2.5rem; margin-bottom: 0.5rem; }
    .subtitle { text-align: center; color: #aaa; margin-bottom: 2rem; }
    .card { background: #1e1e1e; border-radius: 16px; padding: 24px; margin-bottom: 24px; border: 1px solid #333; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
    .input-group { margin-bottom: 1rem; }
    .input-group label { display: block; margin-bottom: 0.5rem; font-size: 14px; color: #ccc; }
    .input-group input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #444; background: #2a2a2a; color: #fff; box-sizing: border-box; font-size: 16px; }
    button { padding: 14px 20px; cursor: pointer; border: none; border-radius: 10px; font-weight: bold; font-size: 16px; transition: all 0.2s; width: 100%; }
    button:hover { opacity: 0.9; transform: translateY(-1px); }
    button:disabled { background: #444; cursor: not-allowed; transform: none; }
    #login-btn { background: #9945FF; color: white; margin-bottom: 2rem; }
    #create-launch-btn { background: #14F195; color: #000; }
    .btn-buy { background: #14F195; color: #000; }
    .btn-sell { background: #ff6b6b; color: #fff; }
    #status { margin-top: 1.5rem; padding: 1rem; border-radius: 8px; font-size: 14px; word-break: break-all; text-align: center; }
    .success { background: #1e3a2b; color: #14F195; border: 1px solid #14F195; }
    .error { background: #3a1e1e; color: #ff6b6b; border: 1px solid #ff6b6b; }
    .info { background: #1e2a3a; color: #58a6ff; border: 1px solid #58a6ff; }
    .hidden { display: none; }
    .flex-row { display: flex; gap: 16px; }
    .flex-row > div { flex: 1; }
    
    /* Tarjeta del Token */
    .token-card { display: flex; gap: 20px; align-items: center; background: #252525; border-radius: 12px; padding: 20px; margin-top: 20px; border-left: 5px solid #14F195; }
    .token-card img { width: 80px; height: 80px; border-radius: 50%; border: 3px solid #14F195; object-fit: cover; }
    .token-info { flex: 1; }
    .token-info h2 { margin: 0 0 5px 0; font-size: 1.8rem; }
    .token-info .symbol { color: #14F195; font-weight: bold; font-size: 1.2rem; }
    .token-stats { display: flex; gap: 30px; margin-top: 15px; }
    .stat { display: flex; flex-direction: column; }
    .stat .label { font-size: 12px; color: #888; text-transform: uppercase; letter-spacing: 1px; }
    .stat .value { font-size: 1.4rem; font-weight: bold; color: #fff; }
    .stat .value.price { color: #14F195; }
  </style>
</head>
<body>
  <h1>🚀 Epic ORB Launchpad</h1>
  <p class="subtitle">Lanza tu token con Bonding Curve o compra/vende tokens existentes.</p>

  <button id="login-btn">🔐 Conectar Wallet e Iniciar Sesión</button>

  <div id="create-section" class="card hidden">
    <h3>✨ Crear Token (Bonding Curve)</h3>
    <div class="input-group">
      <label>Nombre del Token</label>
      <input type="text" id="token-name" placeholder="Ej: Epic ORB Token" value="Epic ORB Token">
    </div>
    <div class="input-group">
      <label>Símbolo</label>
      <input type="text" id="token-symbol" placeholder="Ej: EORB" value="EORB">
    </div>
    <div class="input-group">
      <label>Logo del Token (PNG/JPG)</label>
      <input type="file" id="logo-input" accept="image/png, image/jpeg">
    </div>
    <button id="create-launch-btn">✨ Crear Lanzamiento en Devnet</button>
  </div>

  <div id="trade-section" class="card hidden">
    <h3>📊 Comprar / Vender</h3>
    <div class="input-group">
      <label>Dirección del Lanzamiento (Genesis Account)</label>
      <input type="text" id="genesis-address" placeholder="Se llenará automáticamente al crear...">
    </div>
    <div class="flex-row">
      <div class="input-group">
        <label>Cantidad (SOL / Tokens)</label>
        <input type="number" id="trade-amount" placeholder="0.1" step="0.01" value="0.1">
      </div>
      <div class="input-group">
        <label>Slippage (%)</label>
        <input type="number" id="slippage" value="1" min="0.1" max="50" step="0.1">
      </div>
    </div>
    <div class="flex-row">
      <button id="buy-btn" class="btn-buy">🟢 Comprar</button>
      <button id="sell-btn" class="btn-sell">🔴 Vender</button>
    </div>
  </div>

  <!-- Tarjeta Épica del Token -->
  <div id="token-display" class="hidden"></div>

  <div id="status" class="info">Esperando conexión...</div>

  <script type="module">
    import { Buffer } from 'https://esm.sh/buffer@6.0.3';
    window.Buffer = Buffer;
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.39.3';
    // ✅ IMPORTACIONES CORREGIDAS (transactionBuilder sale de /umi, no de /umi-bundle-defaults)
    import { createUmi } from 'https://esm.sh/@metaplex-foundation/umi-bundle-defaults@1.6.0';
    import { walletAdapterIdentity } from 'https://esm.sh/@metaplex-foundation/umi-signer-wallet-adapters@1.6.0';
    import { publicKey, sol, transactionBuilder } from 'https://esm.sh/@metaplex-foundation/umi@1.6.0';
    import { mplToolbox, createTokenIfMissing, findAssociatedTokenPda, transferSol, syncNative, closeToken } from 'https://esm.sh/@metaplex-foundation/mpl-toolbox@0.11.4';

    const SUPABASE_URL = 'https://zebmhlnqlkmwfgvfivmc.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_geHNN8tkjCA6BWmlMukJYQ_PFIpRAFB';
    const MI_DIRECCION_ORB = 'DeQ2hgNRnFTm1dDp9CKSdiGqbhMwoy2sjP6cqTkFWorb';

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const statusDiv = document.getElementById('status');
    const loginBtn = document.getElementById('login-btn');
    const createSection = document.getElementById('create-section');
    const tradeSection = document.getElementById('trade-section');
    const tokenDisplay = document.getElementById('token-display');
    const createBtn = document.getElementById('create-launch-btn');
    const buyBtn = document.getElementById('buy-btn');
    const sellBtn = document.getElementById('sell-btn');
    const genesisInput = document.getElementById('genesis-address');

    let umi = null;

    function showStatus(msg, type) {
      statusDiv.textContent = msg;
      statusDiv.className = type;
    }

    // --- 1. CONEXIÓN ---
    loginBtn.addEventListener('click', async () => {
      const provider = window.phantom?.solana || window.solana;
      if (!provider || !provider.isPhantom) return showStatus('Instala Phantom Wallet.', 'error');
      
      try {
        await provider.connect();
        const { data, error } = await supabase.auth.signInWithWeb3({
          chain: 'solana',
          statement: 'I accept the Terms of Service of Epic ORB Launchpad.',
          wallet: provider 
        });
        if (error) throw error;

        loginBtn.classList.add('hidden');
        createSection.classList.remove('hidden');
        tradeSection.classList.remove('hidden');

        umi = createUmi('https://api.devnet.solana.com');
        umi.use(walletAdapterIdentity(provider));
        umi.use(mplToolbox());
        showStatus('✅ Conectado. Crea un token o tradea abajo.', 'success');
      } catch (err) {
        console.error(err);
        showStatus('Error: ' + err.message, 'error');
      }
    });

    // --- 2. CREAR LANZAMIENTO Y MOSTRAR TARJETA ---
    createBtn.addEventListener('click', async () => {
      if (!umi) return showStatus('Conecta tu wallet primero.', 'error');
      const fileInput = document.getElementById('logo-input');
      if (!fileInput.files.length) return showStatus('Selecciona un logo.', 'error');

      const tokenName = document.getElementById('token-name').value;
      const tokenSymbol = document.getElementById('token-symbol').value;

      createBtn.disabled = true;
      try {
        showStatus('⏳ Procesando imagen...', 'info');
        const file = fileInput.files[0];
        const reader = new FileReader();
        const fileBase64 = await new Promise((res, rej) => {
          reader.onload = (e) => res(e.target.result.split(',')[1]);
          reader.onerror = rej;
          reader.readAsDataURL(file);
        });

        showStatus('⏳ Subiendo logo a Irys...', 'info');
        const { data: uploadData, error: uploadError } = await supabase.functions.invoke('upload-to-irys', {
          body: { fileBase64, fileName: file.name, fileType: file.type }
        });
        
        if (uploadError) {
          let realErrorMessage = uploadError.message;
          try {
            const errorBody = await uploadError.context.json();
            if (errorBody && errorBody.error) realErrorMessage = errorBody.error;
          } catch (e) {}
          throw new Error(realErrorMessage);
        }
        if (uploadData && uploadData.error) throw new Error(uploadData.error);
        
        const imageUrl = uploadData.url;
        showStatus('✅ Logo subido. Creando lanzamiento en Solana...', 'info');

        const { genesis, createAndRegisterLaunch } = await import('https://cdn.jsdelivr.net/npm/@metaplex-foundation/genesis@0.43.4/+esm');
        umi.use(genesis());

        const launchInput = {
          wallet: umi.identity.publicKey,
          network: 'solana-devnet',
          token: { name: tokenName, symbol: tokenSymbol, image: imageUrl },
          launchType: 'bondingCurve',
          launch: {},
        };

        const result = await createAndRegisterLaunch(umi, {}, launchInput);
        
        // ✅ CORRECCIÓN: Extraer genesisAccount correctamente
        const genesisAddress = result.genesisAccount.toString(); 
        
        if (!genesisAddress) throw new Error("No se pudo obtener la dirección de Genesis.");

        genesisInput.value = genesisAddress;
        showStatus(`🚀 ¡Lanzamiento creado exitosamente!`, 'success');

        await supabase.from('launches').insert({
          authority: MI_DIRECCION_ORB,
          token_name: tokenName,
          token_symbol: tokenSymbol,
          token_image_url: imageUrl,
          genesis_address: genesisAddress
        });

        // 🎨 MOSTRAR LA TARJETA ÉPICA
        await renderTokenCard(genesisAddress, tokenName, tokenSymbol, imageUrl);

      } catch (err) {
        console.error(err);
        showStatus('Error al crear: ' + (err.message || 'Revisa la consola.'), 'error');
      } finally {
        createBtn.disabled = false;
      }
    });

    // --- 3. FUNCIÓN PARA RENDERIZAR LA TARJETA CON PRECIO Y MCAP ---
    async function renderTokenCard(genesisAddress, name, symbol, image) {
      try {
        // Traer info de Metaplex
        const res = await fetch(`https://api.metaplex.com/v1/launches/${genesisAddress}?network=solana-devnet`);
        let launchData = null;
        if (res.ok) {
          const json = await res.json();
          launchData = json.data;
        }

        // Importar dinámicamente las funciones necesarias para calcular precio
        const { findBondingCurveBucketV2Pda, getSwapResult, SwapDirection } = await import('https://cdn.jsdelivr.net/npm/@metaplex-foundation/genesis@0.43.4/+esm');
        
        // ✅ Corregido: findBondingCurveBucketV2Pda en lugar de getBondingCurve...
        const [bucketPda] = findBondingCurveBucketV2Pda(umi, { genesisAccount: publicKey(genesisAddress), bucketIndex: 0 });
        const bucketAccount = await umi.rpc.getAccount(bucketPda);
        
        let price = 0;
        let marketCap = 0;

        if (bucketAccount.exists) {
          const bucket = bucketAccount.data;
          const quote = getSwapResult(bucket, 1_000_000n, SwapDirection.Buy); // Simulamos 0.001 SOL
          if (quote.amountOut > 0n) {
            price = 0.001 / (Number(quote.amountOut) / 1e9);
          }
          const totalSupply = 1_000_000_000; 
          marketCap = price * totalSupply;
        }

        tokenDisplay.innerHTML = `
          <div class="token-card">
            <img src="${image}" alt="${symbol}" onerror="this.src='https://via.placeholder.com/80'">
            <div class="token-info">
              <h2>${name} <span class="symbol">(${symbol})</span></h2>
              <div style="font-size: 12px; color: #888; margin-bottom: 10px;">Genesis: ${genesisAddress.slice(0, 8)}...${genesisAddress.slice(-8)}</div>
              <div class="token-stats">
                <div class="stat">
                  <span class="label">Precio</span>
                  <span class="value price">${price > 0 ? price.toFixed(6) : '0.000000'} SOL</span>
                </div>
                <div class="stat">
                  <span class="label">Market Cap</span>
                  <span class="value">${marketCap > 0 ? '$' + marketCap.toLocaleString('en-US', { maximumFractionDigits: 0 }) : '$0'}</span>
                </div>
                <div class="stat">
                  <span class="label">Estado</span>
                  <span class="value" style="color: #14F195;">Activo</span>
                </div>
              </div>
            </div>
          </div>
        `;
        tokenDisplay.classList.remove('hidden');

      } catch (err) {
        console.error("Error al renderizar tarjeta:", err);
        tokenDisplay.innerHTML = `
          <div class="token-card">
            <img src="${image}" alt="${symbol}" onerror="this.src='https://via.placeholder.com/80'">
            <div class="token-info">
              <h2>${name} <span class="symbol">(${symbol})</span></h2>
              <p style="color: #aaa;">Genesis: ${genesisAddress}</p>
            </div>
          </div>
        `;
        tokenDisplay.classList.remove('hidden');
      }
    }

    // --- 4. COMPRAR (SWAP) ---
    buyBtn.addEventListener('click', async () => {
      if (!umi) return showStatus('Conecta tu wallet primero.', 'error');
      
      const genesisAddress = genesisInput.value.trim();
      const amountSol = parseFloat(document.getElementById('trade-amount').value);
      const slippageBps = parseFloat(document.getElementById('slippage').value) * 100;

      if (!genesisAddress) return showStatus('No hay dirección de Genesis.', 'error');
      if (isNaN(amountSol) || amountSol <= 0) return showStatus('Cantidad inválida.', 'error');

      buyBtn.disabled = true;
      sellBtn.disabled = true;

      try {
        showStatus('⏳ Preparando compra...', 'info');
        
        const { swapBondingCurveV2, getSwapResult, applySlippage, isSwappable, SwapDirection, findBondingCurveBucketV2Pda } = await import('https://cdn.jsdelivr.net/npm/@metaplex-foundation/genesis@0.43.4/+esm');
        
        const genesisPubkey = publicKey(genesisAddress);
        const [bucketPda] = findBondingCurveBucketV2Pda(umi, { genesisAccount: genesisPubkey, bucketIndex: 0 });
        const bucket = await umi.rpc.getAccount(bucketPda);
        if (!isSwappable(bucket)) throw new Error("La curva no está activa.");

        const amountIn = BigInt(Math.floor(amountSol * 1_000_000_000));
        const quote = getSwapResult(bucket, amountIn, SwapDirection.Buy);
        const minAmountOut = applySlippage(quote.amountOut, slippageBps);

        showStatus('⏳ Envolviendo SOL...', 'info');
        
        const WSOL = publicKey('So11111111111111111111111111111111111111112');
        const SPL_TOKEN = publicKey('TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA');
        const [userQuoteTokenAccount] = findAssociatedTokenPda(umi, { mint: WSOL, owner: umi.identity.publicKey });
        const [userBaseTokenAccount] = findAssociatedTokenPda(umi, { mint: quote.baseMint, owner: umi.identity.publicKey });

        await transactionBuilder()
          .add(createTokenIfMissing(umi, { mint: WSOL, token: userQuoteTokenAccount, tokenProgram: SPL_TOKEN }))
          .add(transferSol(umi, { destination: userQuoteTokenAccount, amount: sol(amountSol) }))
          .add(syncNative(umi, { account: userQuoteTokenAccount }))
          .sendAndConfirm(umi);

        showStatus('⏳ Ejecutando compra...', 'info');

        await swapBondingCurveV2(umi, {
          genesisAccount: genesisPubkey,
          bucket: bucketPda,
          baseMint: quote.baseMint,
          quoteMint: WSOL,
          baseTokenAccount: userBaseTokenAccount,
          quoteTokenAccount: userQuoteTokenAccount,
          amount: quote.amountIn,
          minAmountOutScaled: minAmountOut,
          swapDirection: SwapDirection.Buy,
        }).sendAndConfirm(umi);

        showStatus(`✅ Compra exitosa.`, 'success');

        try {
          await closeToken(umi, { account: userQuoteTokenAccount, destination: umi.identity.publicKey, owner: umi.identity }).sendAndConfirm(umi);
        } catch (e) {}

      } catch (err) {
        console.error(err);
        showStatus('Error al comprar: ' + (err.message || 'Revisa la consola.'), 'error');
      } finally {
        buyBtn.disabled = false;
        sellBtn.disabled = false;
      }
    });

    // --- 5. VENDER (SWAP) ---
    sellBtn.addEventListener('click', async () => {
      if (!umi) return showStatus('Conecta tu wallet primero.', 'error');
      
      const genesisAddress = genesisInput.value.trim();
      const amountTokens = parseFloat(document.getElementById('trade-amount').value);
      const slippageBps = parseFloat(document.getElementById('slippage').value) * 100;

      if (!genesisAddress) return showStatus('No hay dirección de Genesis.', 'error');
      if (isNaN(amountTokens) || amountTokens <= 0) return showStatus('Cantidad inválida.', 'error');

      buyBtn.disabled = true;
      sellBtn.disabled = true;

      try {
        showStatus('⏳ Preparando venta...', 'info');
        
        const { swapBondingCurveV2, getSwapResult, applySlippage, isSwappable, SwapDirection, findBondingCurveBucketV2Pda } = await import('https://cdn.jsdelivr.net/npm/@metaplex-foundation/genesis@0.43.4/+esm');
        
        const genesisPubkey = publicKey(genesisAddress);
        const [bucketPda] = findBondingCurveBucketV2Pda(umi, { genesisAccount: genesisPubkey, bucketIndex: 0 });
        const bucket = await umi.rpc.getAccount(bucketPda);
        if (!isSwappable(bucket)) throw new Error("La curva no está activa.");

        const amountIn = BigInt(Math.floor(amountTokens * 1_000_000_000));
        const quote = getSwapResult(bucket, amountIn, SwapDirection.Sell);
        const minAmountOut = applySlippage(quote.amountOut, slippageBps);

        showStatus('⏳ Ejecutando venta...', 'info');

        const WSOL = publicKey('So11111111111111111111111111111111111111112');
        const [userQuoteTokenAccount] = findAssociatedTokenPda(umi, { mint: WSOL, owner: umi.identity.publicKey });
        const [userBaseTokenAccount] = findAssociatedTokenPda(umi, { mint: quote.baseMint, owner: umi.identity.publicKey });

        await swapBondingCurveV2(umi, {
          genesisAccount: genesisPubkey,
          bucket: bucketPda,
          baseMint: quote.baseMint,
          quoteMint: WSOL,
          baseTokenAccount: userBaseTokenAccount,
          quoteTokenAccount: userQuoteTokenAccount,
          amount: quote.amountIn,
          minAmountOutScaled: minAmountOut,
          swapDirection: SwapDirection.Sell,
        }).sendAndConfirm(umi);

        showStatus(`✅ Venta exitosa.`, 'success');

        try {
          await closeToken(umi, { account: userQuoteTokenAccount, destination: umi.identity.publicKey, owner: umi.identity }).sendAndConfirm(umi);
        } catch (e) {}

      } catch (err) {
        console.error(err);
        showStatus('Error al vender: ' + (err.message || 'Revisa la consola.'), 'error');
      } finally {
        buyBtn.disabled = false;
        sellBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
