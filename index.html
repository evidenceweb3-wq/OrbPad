<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Epic ORB Launchpad</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; max-width: 650px; margin: 3rem auto; background: #1a1a1a; color: #fff; padding: 20px; border-radius: 10px;}
    h1 { color: #14F195; }
    .input-group { margin-bottom: 1rem; text-align: left; }
    .input-group label { display: block; margin-bottom: 0.5rem; font-size: 14px; color: #ccc; }
    .input-group input { width: 100%; padding: 10px; border-radius: 5px; border: 1px solid #333; background: #2a2a2a; color: #fff; box-sizing: border-box;}
    button { padding: 1rem 1.5rem; margin: 0.5rem 0; cursor: pointer; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; transition: 0.2s;}
    button:hover { opacity: 0.8; }
    button:disabled { background: #555; cursor: not-allowed; }
    #login-btn { background: #9945FF; color: white; width: 100%; }
    #create-launch-btn { background: #14F195; color: black; width: 100%; margin-top: 1rem;}
    #status { margin-top: 1.5rem; padding: 1rem; border-radius: 8px; font-size: 14px; word-break: break-all;}
    .success { background: #1e3a2b; color: #14F195; border: 1px solid #14F195; }
    .error { background: #3a1e1e; color: #ff6b6b; border: 1px solid #ff6b6b; }
    .info { background: #1e2a3a; color: #58a6ff; border: 1px solid #58a6ff; }
    #launch-form { display: none; }
  </style>
</head>
<body>
  <h1>🚀 Epic ORB Launchpad</h1>
  <p>Lanza tu token de forma justa y segura en Solana Devnet.</p>

  <button id="login-btn">🔐 Conectar Wallet e Iniciar Sesión</button>

  <div id="launch-form">
    <hr style="border-color: #333; margin: 1.5rem 0;">
    <h3>Configura tu Token</h3>
    <div class="input-group">
      <label>Nombre del Token</label>
      <input type="text" id="token-name" placeholder="Ej: Epic ORB Token" value="Epic ORB Token">
    </div>
    <div class="input-group">
      <label>Símbolo</label>
      <input type="text" id="token-symbol" placeholder="Ej: EORB" value="EORB">
    </div>
    <div class="input-group">
      <label>Meta de Recaudación (SOL)</label>
      <input type="number" id="raise-goal" placeholder="10" value="10">
    </div>
    <div class="input-group">
      <label>Logo del Token (PNG/JPG)</label>
      <input type="file" id="logo-input" accept="image/png, image/jpeg">
    </div>
    <button id="create-launch-btn">✨ Crear Lanzamiento en Devnet</button>
  </div>

  <div id="status" class="info">Esperando conexión...</div>

  <script type="module">
    import { Buffer } from 'https://esm.sh/buffer@6.0.3';
    window.Buffer = Buffer;
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.39.3';

    const SUPABASE_URL = 'https://zebmhlnqlkmwfgvfivmc.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_geHNN8tkjCA6BWmlMukJYQ_PFIpRAFB';
    const MI_DIRECCION_ORB = 'DeQ2hgNRnFTmLdP9KCSd1gqbhMw2ysjP6cqtKFWorb';

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const statusDiv = document.getElementById('status');
    const loginBtn = document.getElementById('login-btn');
    const launchForm = document.getElementById('launch-form');
    const createBtn = document.getElementById('create-launch-btn');

    let umi = null;

    function showStatus(msg, type) {
      statusDiv.textContent = msg;
      statusDiv.className = type;
    }

    loginBtn.addEventListener('click', async () => {
      const provider = window.phantom?.solana || window.solana;
      if (!provider || !provider.isPhantom) {
        return showStatus('Phantom no está instalado o no se detectó.', 'error');
      }
      
      try {
        showStatus('Conectando a Phantom...', 'info');
        await provider.connect();
        
        showStatus('Firmando mensaje seguro en Supabase...', 'info');
        
        const { data, error } = await supabase.auth.signInWithWeb3({
          chain: 'solana',
          statement: 'I accept the Terms of Service of Epic ORB Launchpad.',
          wallet: provider 
        });
        
        if (error) throw error;

        showStatus(`✅ Sesión iniciada. Wallet: ${data.user.user_metadata.custom_claims.iss}`, 'success');
        
        loginBtn.style.display = 'none';
        launchForm.style.display = 'block';

        showStatus('Iniciando motor de Solana...', 'info');
        
        const { createUmi } = await import('https://esm.sh/@metaplex-foundation/umi-bundle-defaults@1.5.1');
        const { walletAdapterIdentity } = await import('https://esm.sh/@metaplex-foundation/umi-signer-wallet-adapters@1.5.1');
        
        umi = createUmi('https://api.devnet.solana.com');
        umi.use(walletAdapterIdentity(provider));
        showStatus('✅ Todo listo. Configura tu token abajo.', 'success');
        
      } catch (err) {
        console.error(err);
        showStatus('Error: ' + (err.message || 'Rechazaste la firma.'), 'error');
      }
    });

    createBtn.addEventListener('click', async () => {
      if (!umi) return showStatus('Primero inicia sesión.', 'error');
      
      const fileInput = document.getElementById('logo-input');
      if (!fileInput.files.length) return showStatus('Selecciona un logo.', 'error');

      const tokenName = document.getElementById('token-name').value;
      const tokenSymbol = document.getElementById('token-symbol').value;
      const raiseGoal = parseFloat(document.getElementById('raise-goal').value);

      createBtn.disabled = true;
      
      try {
        showStatus('⏳ Cargando Genesis y el Uploader de Irys...', 'info');
        
        // 1. Importamos Genesis (Metaplex)
        const { genesis, createAndRegisterLaunch } = await import('https://esm.sh/@metaplex-foundation/genesis@0.40.0');
        
        // 2. Importamos Irys con ?bundle para forzar el empaquetado de dependencias
        const { WebUploader } = await import('https://esm.sh/@irys/web-upload@0.0.15?bundle');
        const { WebSolana } = await import('https://esm.sh/@irys/web-upload-solana@0.1.8?bundle');

        umi.use(genesis());

        showStatus('⏳ Preparando subida a Irys (Devnet)...', 'info');
        
        const provider = window.phantom?.solana || window.solana;
        // 3. Inicializamos el uploader de Irys con la wallet y la red Devnet
        const irysUploader = await WebUploader(WebSolana).withProvider(provider).devnet();
        const file = fileInput.files[0];

        // 4. Financiamiento automático si la imagen supera los 100 KB (usa SOL de Devnet)
        const price = await irysUploader.getPrice(file.size);
        if (price > 0) { 
          const balance = await irysUploader.getBalance();
          if (balance < price) {
            showStatus('💰 Financiando subida con SOL de Devnet (Firma en Phantom)...', 'info');
            await irysUploader.fund(price); 
          }
        }

        showStatus('⏳ Subiendo logo a Irys...', 'info');
        // 5. Subimos el archivo y obtenemos la URL
        const receipt = await irysUploader.uploadFile(file, { 
          tags: [{ name: "Content-Type", value: file.type }] 
        });
        const imageUrl = `https://gateway.irys.xyz/${receipt.id}`;
        
        showStatus('✅ Logo subido. Creando lanzamiento en Solana...', 'info');

        const launchInput = {
          wallet: umi.identity.publicKey,
          launchType: 'launchpool',
          token: { name: tokenName, symbol: tokenSymbol, image: imageUrl },
          launch: {
            launchpool: {
              tokenAllocation: 500_000_000,
              depositStartTime: new Date(Date.now() + 3600_000),
              raiseGoal: raiseGoal,
              raydiumLiquidityBps: 5000,
              fundsRecipient: MI_DIRECCION_ORB, 
            },
          },
        };

        const result = await createAndRegisterLaunch(umi, {}, launchInput);
        showStatus(`✅ ¡Lanzamiento creado! Mint: ${result.mintAddress}`, 'success');

        await supabase.from('launches').insert({
          authority: MI_DIRECCION_ORB,
          token_name: tokenName,
          token_symbol: tokenSymbol,
          token_image_url: imageUrl,
          raise_goal_sol: raiseGoal,
          deposit_start_time: launchInput.launch.launchpool.depositStartTime.toISOString(),
        });
        
        showStatus('🚀 ¡Lanzamiento creado y guardado exitosamente!', 'success');
        
      } catch (err) {
        console.error(err);
        showStatus('Error al crear: ' + (err.message || 'Revisa la consola (F12).'), 'error');
      } finally {
        createBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
