<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Launchpad Pump.fun - Epic Edition</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: system-ui, -apple-system, sans-serif; background: #0b0b0e; color: #e0e0e0; margin: 0; padding: 8px; height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        .app-container { display: grid; grid-template-columns: 340px 1fr; gap: 12px; width: 100%; max-width: 1200px; height: 98vh; max-height: 850px; }
        
        .panel { background: #15151a; border: 1px solid #2a2a35; border-radius: 14px; padding: 12px; display: flex; flex-direction: column; box-shadow: 0 4px 20px rgba(0,0,0,0.4); overflow: hidden; }
        .panel-scroll { overflow-y: auto; flex: 1; padding-right: 4px; }
        .panel-scroll::-webkit-scrollbar { width: 4px; }
        .panel-scroll::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
        
        h1, h2, h3 { color: #fff; margin-top: 0; margin-bottom: 8px; font-weight: 600; }
        h2 { font-size: 0.85rem; color: #a8a8b3; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 10px; }
        
        button { background: #9945FF; color: white; border: none; padding: 8px 12px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.2s; font-size: 0.85rem; }
        button:hover:not(:disabled) { background: #7a35d6; transform: translateY(-1px); }
        button:disabled { background: #333; color: #777; cursor: not-allowed; }
        
        input { padding: 8px; border-radius: 6px; border: 1px solid #2a2a35; background: #0b0b0e; color: #fff; margin-bottom: 6px; width: 100%; font-size: 0.85rem; outline: none; }
        input:focus { border-color: #9945FF; }
        input[type="file"] { padding: 5px; font-size: 0.75rem; }
        
        .status { font-size: 0.75rem; color: #14F195; margin-top: 4px; word-break: break-all; white-space: pre-wrap; line-height: 1.2; }
        .error { color: #ff6b6b !important; }
        
        .token-card { display: flex; gap: 10px; background: #0b0b0e; border: 1px solid #2a2a35; padding: 8px 10px; border-radius: 10px; align-items: center; margin-bottom: 8px; }
        .token-card img { width: 40px; height: 40px; border-radius: 8px; object-fit: cover; background: #222; }
        .token-info { flex: 1; overflow: hidden; }
        .token-name { font-weight: bold; font-size: 1rem; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .token-symbol { color: #14F195; font-size: 0.8rem; }
        
        .metrics-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 8px; }
        .metric-box { background: #0b0b0e; border: 1px solid #2a2a35; padding: 6px; border-radius: 8px; text-align: center; }
        .metric-box span { display: block; font-size: 0.65rem; color: #888; text-transform: uppercase; }
        .metric-box strong { font-size: 0.9rem; color: #fff; }
        
        .chart-container { flex: 1; min-height: 160px; width: 100%; position: relative; background: #0b0b0e; border-radius: 8px; border: 1px solid #2a2a35; overflow: hidden; margin-bottom: 8px; }
        
        .trade-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .quick-buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-bottom: 6px; }
        .quick-buttons button { background: #1f1f28; color: #e0e0e0; font-size: 0.7rem; padding: 4px; border: 1px solid #2a2a35; }
        .quick-buttons button:hover { background: #333; color: #fff; }
        
        hr { border: 0; border-top: 1px solid #2a2a35; margin: 10px 0; }
        
        .jwt-wrapper { display: flex; gap: 6px; align-items: center; margin-bottom: 6px;}
        .jwt-wrapper input { margin-bottom: 0; flex: 1; }
        .jwt-wrapper button { background: #14F195; color: #000; padding: 8px; font-size: 0.75rem; }
        .jwt-wrapper button:hover { background: #0fbf75; }

        .saved-tokens-list { max-height: 120px; overflow-y: auto; border: 1px solid #2a2a35; border-radius: 8px; padding: 4px; margin-top: 4px; }
        .saved-token-item { display: flex; justify-content: space-between; align-items: center; padding: 4px 6px; border-bottom: 1px solid #222; cursor: pointer; border-radius: 4px; }
        .saved-token-item:hover { background: #2a2a35; }
        .saved-token-item:last-child { border-bottom: none; }
        .saved-token-symbol { font-weight: bold; color: #14F195; font-size: 0.8rem; }
        .saved-token-mint { font-size: 0.65rem; color: #888; }
        
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        .graduated-badge { font-size:0.7rem; background:#14F195; color:#000; padding:2px 6px; border-radius:4px; font-weight:bold; animation: pulse 2s infinite; }
    </style>
    <!-- Forzamos una versión estable del gráfico -->
    <script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>

    <div class="app-container">
        <!-- COLUMNA IZQUIERDA: Crear Token -->
        <div class="panel">
            <h1 style="font-size: 1.2rem; color:#9945FF;">🚀 Launchpad</h1>
            
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; background: #0b0b0e; padding: 8px; border-radius: 8px; border: 1px solid #2a2a35;">
                <div>
                    <div style="font-size: 0.65rem; color: #888;">WALLET</div>
                    <div id="walletBalance" style="font-size: 0.85rem; color: #14F195; font-weight: bold;">0.00 SOL</div>
                </div>
                <button id="connectBtn" style="width:auto; margin:0; padding: 6px 10px;">Conectar</button>
            </div>
            <p id="walletStatus" class="status" style="margin-top:0; margin-bottom:8px; font-size: 0.65rem;">No conectado</p>

            <div class="panel-scroll">
                <h2>Crear Token</h2>
                <div class="jwt-wrapper">
                    <input id="pinataJwt" type="password" placeholder="Pinata JWT" />
                    <button id="saveJwtBtn" title="Guardar JWT">💾</button>
                </div>
                <input id="tokenName" placeholder="Nombre del Token" />
                <input id="tokenSymbol" placeholder="Símbolo (ej. MTK)" />
                <input id="tokenImage" type="file" accept="image/*" />
                <button id="createTokenBtn" disabled style="width:100%;">Crear + Compra Inicial (0.01 SOL)</button>
                <p id="createStatus" class="status"></p>

                <h2 style="margin-top: 15px;">Mis Tokens Creados</h2>
                <button id="loadSavedTokensBtn" disabled style="width:100%; background: #333; font-size: 0.75rem; padding: 4px;">Cargar Mis Tokens</button>
                <div id="savedTokensList" class="saved-tokens-list" style="display: none;"></div>
            </div>
        </div>

        <!-- COLUMNA DERECHA: Trading y Datos -->
        <div class="panel">
            <h2 style="margin-top:0;">Token Activo</h2>
            <div style="display:flex; gap:6px; margin-bottom: 8px;">
                <input id="mintAddressInput" placeholder="Mint Address" style="margin-bottom:0;" />
                <button id="loadTokenBtn" style="width:auto;">Cargar</button>
            </div>

            <div id="tokenDisplay" style="display:none; flex: 1; flex-direction: column;">
                <div class="token-card">
                    <img id="tokenImagePreview" src="https://placehold.co/100x100/1f1f28/14F195?text=Coin" alt="Token" />
                    <div class="token-info">
                        <div class="token-name" id="displayName">—</div>
                        <div class="token-symbol" id="displaySymbol">—</div>
                    </div>
                    <div id="graduatedBadge" class="graduated-badge" style="display:none;">GRADUADO</div>
                </div>

                <div class="metrics-row">
                    <div class="metric-box"><span>Market Cap</span><strong id="mcap">—</strong></div>
                    <div class="metric-box"><span>Precio</span><strong id="price">—</strong></div>
                    <div class="metric-box"><span>Progreso</span><strong id="progress">—</strong></div>
                </div>
                
                <div id="chartContainer" class="chart-container"></div>
            </div>

            <div id="tradeSection" style="display:none;">
                <div class="trade-grid">
                    <!-- COMPRAR -->
                    <div>
                        <h2>Comprar</h2>
                        <div class="quick-buttons">
                            <button onclick="setSolAmount(0.01)">0.01</button>
                            <button onclick="setSolAmount(0.05)">0.05</button>
                            <button onclick="setSolAmount(0.1)">0.1</button>
                            <button onclick="setSolAmount(0.5)">0.5</button>
                        </div>
                        <input id="solAmount" type="number" step="0.001" placeholder="SOL a gastar" />
                        <button id="buyBtn" disabled style="width:100%;">Comprar</button>
                    </div>

                    <!-- VENDER -->
                    <div>
                        <h2>Vender</h2>
                        <input id="tokenAmountToSell" type="number" step="any" placeholder="Cantidad" style="margin-top: 24px;" />
                        <button id="sellBtn" disabled style="width:100%; background:#ff6b6b;">Vender</button>
                    </div>
                </div>
                <p id="tradeStatus" class="status"></p>
            </div>
        </div>
    </div>

    <!-- IMPORT MAP -->
    <script type="importmap">
        {
            "imports": {
                "@solana/web3.js": "https://esm.sh/@solana/web3.js@1.98.0",
                "@nirholas/pump-sdk": "https://esm.sh/@nirholas/pump-sdk@1.32.0",
                "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2",
                "bn.js": "https://esm.sh/bn.js@5"
            }
        }
    </script>

    <script type="module">
        // CONFIGURACIÓN
        const SUPABASE_URL = 'https://dzqoxbdnysxqylvwluzz.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_R6Hb2unSpr4ssW9Cl_9VkA_KyfZzIux';

        import { Connection, PublicKey, Keypair, LAMPORTS_PER_SOL, VersionedTransaction, TransactionMessage, ComputeBudgetProgram } from '@solana/web3.js';
        import { OnlinePumpSdk, PUMP_SDK, getBuyTokenAmountFromSolAmount, getSellSolAmountFromTokenAmount, newBondingCurve } from '@nirholas/pump-sdk';
        import { createClient } from '@supabase/supabase-js';
        import BN from 'bn.js';

        const connection = new Connection('https://devnet.helius-rpc.com/?api-key=f600a1bb-1023-469b-8b21-1f424fe50931', 'confirmed');
        const onlineSdk = new OnlinePumpSdk(connection);
        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let wallet = null;
        let userPublicKey = null;
        let currentMint = null;
        let activeImageUrl = null;
        
        // Variables del Gráfico
        let chart = null;
        let areaSeries = null;
        let lastChartTime = Math.floor(Date.now() / 1000) - 100;
        let chartInitialized = false;

        // --- BLINDAJE ANTI-CUELGUES ---
        async function withTimeout(promise, timeoutMs = 15000) {
            return Promise.race([
                promise,
                new Promise((_, reject) => setTimeout(() => reject(new Error('La red de Solana tardó mucho en responder. Revisa tu conexión o intenta de nuevo.')), timeoutMs))
            ]);
        }

        // --- INICIALIZAR GRÁFICO ---
        function initChartIfNeeded() {
            if (chartInitialized) return;
            const container = document.getElementById('chartContainer');
            if (container.clientWidth === 0 || container.clientHeight === 0) return;

            try {
                chart = LightweightCharts.createChart(container, {
                    layout: { background: { type: 'solid', color: 'transparent' }, textColor: '#888' },
                    grid: { vertLines: { color: '#222' }, horzLines: { color: '#222' } },
                    rightPriceScale: { borderColor: '#333' },
                    timeScale: { borderColor: '#333', timeVisible: true },
                    crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
                });
                
                areaSeries = chart.addAreaSeries({
                    lineColor: '#14F195',
                    topColor: 'rgba(20, 241, 149, 0.3)',
                    bottomColor: 'rgba(20, 241, 149, 0.0)',
                    lineWidth: 2,
                });

                const resizeObserver = new ResizeObserver(entries => {
                    if (entries.length === 0 || entries[0].target !== container) return;
                    const newRect = entries[0].contentRect;
                    chart.applyOptions({ width: newRect.width, height: newRect.height });
                });
                resizeObserver.observe(container);

                chartInitialized = true;
            } catch (e) {
                console.error("Error al inicializar el gráfico:", e);
            }
        }

        // --- JWT GUARDADO ---
        const jwtInput = document.getElementById('pinataJwt');
        const savedJwt = localStorage.getItem('pinata_jwt');
        if (savedJwt) {
            jwtInput.value = savedJwt;
            jwtInput.type = 'text';
            jwtInput.style.color = '#14F195';
        }

        document.getElementById('saveJwtBtn').addEventListener('click', () => {
            const val = jwtInput.value.trim();
            if (val) {
                localStorage.setItem('pinata_jwt', val);
                jwtInput.style.color = '#14F195';
                alert('✅ JWT guardado.');
            }
        });

        // --- ACTUALIZAR BALANCE ---
        async function updateWalletBalance() {
            if (!userPublicKey) return;
            try {
                const balance = await withTimeout(connection.getBalance(userPublicKey));
                document.getElementById('walletBalance').textContent = `${(balance / LAMPORTS_PER_SOL).toFixed(3)} SOL`;
            } catch (e) { console.warn('Error balance', e); }
        }

        // 1. Conectar Wallet
        document.getElementById('connectBtn').addEventListener('click', async () => {
            if (!window.solana || !window.solana.isPhantom) return alert('Instala Phantom en Devnet.');
            try {
                const resp = await window.solana.connect();
                userPublicKey = resp.publicKey;
                wallet = window.solana;
                document.getElementById('walletStatus').textContent = `Conectado`;
                document.getElementById('connectBtn').style.display = 'none';
                ['createTokenBtn', 'buyBtn', 'sellBtn', 'loadTokenBtn', 'loadSavedTokensBtn'].forEach(id => document.getElementById(id).disabled = false);
                await updateWalletBalance();
            } catch (err) {
                document.getElementById('walletStatus').textContent = `Error: ${err.message}`;
                document.getElementById('walletStatus').classList.add('error');
            }
        });

        // Previsualización de imagen
        document.getElementById('tokenImage').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                activeImageUrl = URL.createObjectURL(file);
                document.getElementById('tokenImagePreview').src = activeImageUrl;
            }
        });

        // 2. Subir IPFS
        async function uploadToPinata(jwt, file, name, symbol) {
            const imgForm = new FormData();
            imgForm.append('file', file);
            const imgRes = await fetch('https://api.pinata.cloud/pinning/pinFileToIPFS', {
                method: 'POST', headers: { Authorization: `Bearer ${jwt}` }, body: imgForm,
            });
            if (!imgRes.ok) throw new Error('Error en imagen Pinata');
            const imageUri = `https://gateway.pinata.cloud/ipfs/${(await imgRes.json()).IpfsHash}`;

            const metadata = { name, symbol, image: imageUri, description: '' };
            const metaForm = new FormData();
            metaForm.append('file', new Blob([JSON.stringify(metadata)], { type: 'application/json' }), 'metadata.json');
            const metaRes = await fetch('https://api.pinata.cloud/pinning/pinFileToIPFS', {
                method: 'POST', headers: { Authorization: `Bearer ${jwt}` }, body: metaForm,
            });
            if (!metaRes.ok) throw new Error('Error en metadata Pinata');
            return `https://gateway.pinata.cloud/ipfs/${(await metaRes.json()).IpfsHash}`;
        }

        // 3. Crear Token (Blindado)
        document.getElementById('createTokenBtn').addEventListener('click', async () => {
            const statusEl = document.getElementById('createStatus');
            statusEl.textContent = 'Subiendo a IPFS...'; statusEl.classList.remove('error');
            try {
                const jwt = jwtInput.value.trim();
                const name = document.getElementById('tokenName').value.trim();
                const symbol = document.getElementById('tokenSymbol').value.trim();
                const imgFile = document.getElementById('tokenImage').files[0];
                
                if (!jwt || !name || !symbol || !imgFile) throw new Error('Llena todos los campos.');

                const metadataUri = await withTimeout(uploadToPinata(jwt, imgFile, name, symbol), 20000);
                statusEl.textContent = 'Creando token en la curva...';

                const mintKeypair = Keypair.generate();
                const global = await withTimeout(onlineSdk.fetchGlobal());
                const feeConfig = await withTimeout(onlineSdk.fetchFeeConfig());
                
                const solToSpend = new BN(0.01 * LAMPORTS_PER_SOL);
                const initialCurve = newBondingCurve(global);
                const tokensOut = getBuyTokenAmountFromSolAmount({ global, feeConfig, mintSupply: null, bondingCurve: initialCurve, amount: solToSpend });

                const instructions = await PUMP_SDK.createV2AndBuyInstructions({
                    global, feeConfig, mint: mintKeypair.publicKey, name, symbol, uri: metadataUri, 
                    creator: userPublicKey, user: userPublicKey, amount: tokensOut, solAmount: solToSpend, 
                    slippage: 0.10, mayhemMode: false, cashback: false
                });

                const { blockhash, lastValidBlockHeight } = await withTimeout(connection.getLatestBlockhash('confirmed'));
                const messageV0 = new TransactionMessage({ payerKey: userPublicKey, recentBlockhash: blockhash, instructions }).compileToV0Message();
                const tx = new VersionedTransaction(messageV0);
                tx.sign([mintKeypair]);

                statusEl.textContent = '✍️ Firma en Phantom...';
                const signed = await wallet.signTransaction(tx);
                
                statusEl.textContent = 'Enviando a la red...';
                const txId = await connection.sendRawTransaction(signed.serialize());
                await withTimeout(connection.confirmTransaction({ signature: txId, blockhash, lastValidBlockHeight }, 'confirmed'), 30000);

                const mintAddress = mintKeypair.publicKey.toBase58();
                statusEl.textContent = `✅ Token creado.\nMint: ${mintAddress}`;
                
                document.getElementById('mintAddressInput').value = mintAddress;
                document.getElementById('displayName').textContent = name;
                document.getElementById('displaySymbol').textContent = symbol;
                document.getElementById('tokenImagePreview').src = activeImageUrl;
                document.getElementById('tokenDisplay').style.display = 'flex';
                document.getElementById('tradeSection').style.display = 'block';
                
                setTimeout(initChartIfNeeded, 100);
                await loadTokenData(mintAddress);
                await updateWalletBalance(); 
                
                try {
                    await supabase.from('launchpad_tokens').insert([{ mint_address: mintAddress, name, symbol, metadata_uri: metadataUri, creator_wallet: userPublicKey.toBase58() }]);
                } catch (e) { console.warn('Supabase offline'); }

            } catch (err) {
                statusEl.textContent = `❌ ${err.message}`; statusEl.classList.add('error');
                console.error(err);
            }
        });

        // 3.5. Cargar Tokens Guardados
        document.getElementById('loadSavedTokensBtn').addEventListener('click', async () => {
            const listContainer = document.getElementById('savedTokensList');
            listContainer.innerHTML = 'Cargando...';
            listContainer.style.display = 'block';
            try {
                const { data, error } = await supabase
                    .from('launchpad_tokens')
                    .select('*')
                    .eq('creator_wallet', userPublicKey.toBase58());

                if (error) throw error;
                if (!data || data.length === 0) {
                    listContainer.innerHTML = 'No tienes tokens creados.';
                    return;
                }

                listContainer.innerHTML = '';
                data.forEach(token => {
                    const item = document.createElement('div');
                    item.className = 'saved-token-item';
                    item.innerHTML = `
                        <div>
                            <div class="saved-token-symbol">${token.symbol}</div>
                            <div class="saved-token-mint">${token.mint_address.substring(0, 8)}...</div>
                        </div>
                        <button style="padding: 2px 6px; font-size: 0.7rem;">Cargar</button>
                    `;
                    item.onclick = () => {
                        document.getElementById('mintAddressInput').value = token.mint_address;
                        document.getElementById('displayName').textContent = token.name;
                        document.getElementById('displaySymbol').textContent = token.symbol;
                        document.getElementById('tokenImagePreview').src = 'https://placehold.co/100x100/1f1f28/14F195?text=' + token.symbol;
                        loadTokenData(token.mint_address);
                    };
                    listContainer.appendChild(item);
                });
            } catch (e) {
                listContainer.innerHTML = `Error: ${e.message}`;
            }
        });

        // 4. Cargar Datos y Actualizar Gráfico
        document.getElementById('loadTokenBtn').addEventListener('click', () => loadTokenData(document.getElementById('mintAddressInput').value.trim()));

        async function loadTokenData(mintStr) {
            if (!mintStr) return;
            try {
                currentMint = new PublicKey(mintStr);
                const bondingCurve = await withTimeout(onlineSdk.fetchBondingCurve(currentMint));
                
                const vSol = bondingCurve.virtualQuoteReserves ? bondingCurve.virtualQuoteReserves : bondingCurve.virtualSolReserves;
                const vToken = bondingCurve.virtualTokenReserves;
                
                if (!vSol || !vToken) throw new Error('Curva no reconocida.');

                const mcapLamports = vSol.mul(bondingCurve.tokenTotalSupply).div(vToken);
                const mcapSol = mcapLamports.toNumber() / LAMPORTS_PER_SOL;
                const progressPct = Math.min((mcapSol / 69) * 100, 100); 
                
                const priceSol = (vSol.toNumber() / 1e9) / (vToken.toNumber() / 1e6);
                
                let priceStr = priceSol.toFixed(9); 
                priceStr = priceStr.replace(/0+$/, '').replace(/\.$/, ''); 
                if (priceStr === '0' || priceStr === '') priceStr = priceSol.toExponential(4);

                document.getElementById('mcap').textContent = `${mcapSol.toFixed(2)} SOL`;
                document.getElementById('price').textContent = `${priceStr} SOL`;
                document.getElementById('progress').textContent = `${progressPct.toFixed(1)}%`;
                
                document.getElementById('tokenDisplay').style.display = 'flex';
                document.getElementById('tradeSection').style.display = 'block';

                if (progressPct >= 99.0 || bondingCurve.complete) {
                    document.getElementById('graduatedBadge').style.display = 'block';
                } else {
                    document.getElementById('graduatedBadge').style.display = 'none';
                }

                initChartIfNeeded();
                if (areaSeries) {
                    lastChartTime += 1; 
                    if (lastChartTime > Math.floor(Date.now() / 1000)) lastChartTime = Math.floor(Date.now() / 1000);
                    areaSeries.update({ time: lastChartTime, value: mcapSol });
                    if (chart.timeScale().getVisibleLogicalRange() === null) chart.timeScale().fitContent();
                }

            } catch (e) {
                console.error(e);
            }
        }

        // 5. Compra Rápida
        window.setSolAmount = (val) => { document.getElementById('solAmount').value = val; };

        document.getElementById('buyBtn').addEventListener('click', async () => {
            const statusEl = document.getElementById('tradeStatus'); statusEl.textContent = 'Comprando...'; statusEl.classList.remove('error');
            try {
                if (!currentMint) throw new Error('Carga un token primero.');
                const solInput = parseFloat(document.getElementById('solAmount').value);
                if (!solInput || solInput <= 0) throw new Error('SOL inválido.');

                const solAmount = new BN(Math.floor(solInput * LAMPORTS_PER_SOL));
                const buyState = await withTimeout(onlineSdk.fetchBuyState(currentMint, userPublicKey));
                const global = await withTimeout(onlineSdk.fetchGlobal());
                const feeConfig = await withTimeout(onlineSdk.fetchFeeConfig());

                const amount = getBuyTokenAmountFromSolAmount({ global, feeConfig, mintSupply: buyState.bondingCurve.tokenTotalSupply, bondingCurve: buyState.bondingCurve, amount: solAmount });
                
                // Añadimos global y feeConfig explícitamente
                const instructions = await PUMP_SDK.buyInstructions({ 
                    ...buyState, global, feeConfig, mint: currentMint, user: userPublicKey, amount, solAmount, slippage: 0.10 
                });

                instructions.push(
                    ComputeBudgetProgram.setComputeUnitLimit({ units: 1000000 }),
                    ComputeBudgetProgram.setComputeUnitPrice({ microLamports: 100000 })
                );

                const { blockhash, lastValidBlockHeight } = await withTimeout(connection.getLatestBlockhash('confirmed'));
                const messageV0 = new TransactionMessage({ payerKey: userPublicKey, recentBlockhash: blockhash, instructions }).compileToV0Message();
                const tx = new VersionedTransaction(messageV0);
                
                statusEl.textContent = '✍️ Firma en Phantom...';
                const signed = await wallet.signTransaction(tx);
                
                statusEl.textContent = 'Enviando a la red...';
                const sig = await connection.sendRawTransaction(signed.serialize());
                await withTimeout(connection.confirmTransaction({ signature: sig, blockhash, lastValidBlockHeight }, 'confirmed'), 30000);
                
                statusEl.textContent = `✅ Compra OK.`;
                await loadTokenData(currentMint.toBase58());
                await updateWalletBalance();
            } catch (err) {
                statusEl.textContent = `❌ ${err.message}`; statusEl.classList.add('error');
            }
        });

        // 6. Venta (Corregido y Blindado)
        document.getElementById('sellBtn').addEventListener('click', async () => {
            const statusEl = document.getElementById('tradeStatus'); statusEl.textContent = 'Vendiendo...'; statusEl.classList.remove('error');
            try {
                if (!currentMint) throw new Error('Carga un token primero.');
                const tokenInput = parseFloat(document.getElementById('tokenAmountToSell').value);
                if (!tokenInput || tokenInput <= 0) throw new Error('Cantidad inválida.');

                const amount = new BN(Math.floor(tokenInput * 1_000_000));
                const sellState = await withTimeout(onlineSdk.fetchSellState(currentMint, userPublicKey));
                const global = await withTimeout(onlineSdk.fetchGlobal());
                const feeConfig = await withTimeout(onlineSdk.fetchFeeConfig());

                const solAmount = getSellSolAmountFromTokenAmount({ global, feeConfig, mintSupply: sellState.bondingCurve.tokenTotalSupply, bondingCurve: sellState.bondingCurve, amount });
                
                // LA CLAVE DEL ÉXITO: Pasar global y feeConfig explícitamente
                const instructions = await PUMP_SDK.sellInstructions({ 
                    ...sellState, 
                    global, 
                    feeConfig, 
                    mint: currentMint, 
                    user: userPublicKey, 
                    amount, 
                    solAmount, 
                    slippage: 0.10 
                });

                instructions.push(
                    ComputeBudgetProgram.setComputeUnitLimit({ units: 1000000 }),
                    ComputeBudgetProgram.setComputeUnitPrice({ microLamports: 100000 })
                );

                const { blockhash, lastValidBlockHeight } = await withTimeout(connection.getLatestBlockhash('confirmed'));
                const messageV0 = new TransactionMessage({ payerKey: userPublicKey, recentBlockhash: blockhash, instructions }).compileToV0Message();
                const tx = new VersionedTransaction(messageV0);
                
                statusEl.textContent = '✍️ Firma en Phantom...';
                const signed = await wallet.signTransaction(tx);
                
                statusEl.textContent = 'Enviando a la red...';
                const sig = await connection.sendRawTransaction(signed.serialize());
                await withTimeout(connection.confirmTransaction({ signature: sig, blockhash, lastValidBlockHeight }, 'confirmed'), 30000);
                
                statusEl.textContent = `✅ Venta OK.`;
                await loadTokenData(currentMint.toBase58());
                await updateWalletBalance();
            } catch (err) {
                statusEl.textContent = `❌ ${err.message}`; statusEl.classList.add('error');
            }
        });
    </script>
</body>
