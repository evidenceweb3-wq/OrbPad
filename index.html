<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Launchpad Pump.fun - One Screen</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: system-ui, sans-serif; background: #0b0b0e; color: #e0e0e0; margin: 0; padding: 12px; height: 100vh; display: flex; justify-content: center; align-items: center; }
        .app-container { display: grid; grid-template-columns: 320px 1fr; gap: 16px; width: 100%; max-width: 1150px; height: 92vh; max-height: 820px; }
        .panel { background: #15151a; border: 1px solid #2a2a35; border-radius: 14px; padding: 16px; display: flex; flex-direction: column; overflow-y: auto; }
        .panel::-webkit-scrollbar { width: 4px; }
        .panel::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
        h1, h2, h3 { color: #fff; margin-top: 0; margin-bottom: 8px; font-weight: 600; }
        h2 { font-size: 1rem; color: #a8a8b3; text-transform: uppercase; letter-spacing: 0.5px; }
        button { background: #9945FF; color: white; border: none; padding: 8px 12px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        button:hover:not(:disabled) { background: #7a35d6; }
        button:disabled { background: #333; color: #777; cursor: not-allowed; }
        input { padding: 8px 10px; border-radius: 6px; border: 1px solid #2a2a35; background: #0b0b0e; color: #fff; margin-bottom: 8px; width: 100%; font-size: 0.9rem; }
        input[type="file"] { padding: 6px; font-size: 0.8rem; }
        .status { font-size: 0.78rem; color: #14F195; margin-top: 4px; word-break: break-all; white-space: pre-wrap; line-height: 1.3; }
        .error { color: #ff6b6b !important; }
        .token-card { display: flex; gap: 12px; background: #0b0b0e; border: 1px solid #2a2a35; padding: 12px; border-radius: 10px; margin-top: 8px; align-items: center; }
        .token-card img { width: 50px; height: 50px; border-radius: 8px; object-fit: cover; background: #222; }
        .token-info { flex: 1; overflow: hidden; }
        .token-name { font-weight: bold; font-size: 1.1rem; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .token-symbol { color: #14F195; font-size: 0.85rem; }
        .metrics-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
        .metric-box { background: #0b0b0e; border: 1px solid #2a2a35; padding: 8px 10px; border-radius: 8px; text-align: center; }
        .metric-box span { display: block; font-size: 0.7rem; color: #888; text-transform: uppercase; }
        .metric-box strong { font-size: 1rem; color: #fff; }
        .quick-buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 8px; }
        .quick-buttons button { background: #1f1f28; color: #e0e0e0; font-size: 0.8rem; padding: 6px; border: 1px solid #2a2a35; }
        .quick-buttons button:hover { background: #333; color: #fff; }
        canvas { width: 100%; height: 220px; background: #0b0b0e; border-radius: 8px; margin-top: 8px; }
        hr { border: 0; border-top: 1px solid #2a2a35; margin: 12px 0; }
        .jwt-wrapper { display: flex; gap: 8px; align-items: center; }
        .jwt-wrapper input { margin-bottom: 0; flex: 1; }
        .jwt-wrapper button { background: #14F195; color: #000; padding: 8px; font-size: 0.8rem; }
        .jwt-wrapper button:hover { background: #0fbf75; }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- COLUMNA IZQUIERDA: Crear Token -->
        <div class="panel">
            <h1 style="font-size: 1.3rem; color:#9945FF;">🚀 Launchpad</h1>
            
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; background: #0b0b0e; padding: 10px; border-radius: 8px; border: 1px solid #2a2a35;">
                <div>
                    <div style="font-size: 0.75rem; color: #888;">WALLET</div>
                    <div id="walletBalance" style="font-size: 0.9rem; color: #14F195; font-weight: bold;">0.00 SOL</div>
                </div>
                <button id="connectBtn" style="width:auto; margin:0;">Conectar</button>
            </div>
            <p id="walletStatus" class="status" style="margin-top:0; margin-bottom:12px; font-size: 0.7rem;">No conectado</p>

            <h2>Crear Token</h2>
            <div class="jwt-wrapper">
                <input id="pinataJwt" type="password" placeholder="Pinata JWT (se guarda automático)" />
                <button id="saveJwtBtn" title="Guardar JWT">💾</button>
            </div>
            <div style="height: 8px;"></div>
            <input id="tokenName" placeholder="Nombre del Token" />
            <input id="tokenSymbol" placeholder="Símbolo (ej. MTK)" />
            <input id="tokenImage" type="file" accept="image/*" />
            <button id="createTokenBtn" disabled style="width:100%;">Crear + Compra Inicial (0.01 SOL)</button>
            <p id="createStatus" class="status"></p>
        </div>

        <!-- COLUMNA DERECHA: Trading y Datos -->
        <div class="panel">
            <h2>Token Activo</h2>
            <div style="display:flex; gap:8px;">
                <input id="mintAddressInput" placeholder="Mint Address del token" style="margin-bottom:0;" />
                <button id="loadTokenBtn" style="width:auto;">Cargar</button>
            </div>

            <div id="tokenDisplay" style="display:none;">
                <div class="token-card">
                    <img id="tokenImagePreview" src="https://placehold.co/100x100/1f1f28/14F195?text=Coin" alt="Token" />
                    <div class="token-info">
                        <div class="token-name" id="displayName">—</div>
                        <div class="token-symbol" id="displaySymbol">—</div>
                    </div>
                    <div id="graduatedBadge" style="font-size:0.75rem; background:#14F195; color:#000; padding:2px 6px; border-radius:4px; font-weight:bold; display:none;">GRADUADO</div>
                </div>

                <div class="metrics-row">
                    <div class="metric-box"><span>Market Cap</span><strong id="mcap">—</strong></div>
                    <div class="metric-box"><span>Precio</span><strong id="price">—</strong></div>
                    <div class="metric-box"><span>Progreso</span><strong id="progress">—</strong></div>
                </div>
                
                <canvas id="chartCanvas" width="600" height="200"></canvas>
            </div>

            <hr />

            <h2>Comprar</h2>
            <div class="quick-buttons">
                <button onclick="setSolAmount(0.01)">0.01</button>
                <button onclick="setSolAmount(0.05)">0.05</button>
                <button onclick="setSolAmount(0.075)">0.075</button>
                <button onclick="setSolAmount(0.1)">0.1</button>
            </div>
            <input id="solAmount" type="number" step="0.001" placeholder="SOL a gastar" />
            <button id="buyBtn" disabled style="width:100%;">Comprar con SOL</button>

            <hr />
            
            <h2>Vender</h2>
            <input id="tokenAmountToSell" type="number" step="any" placeholder="Cantidad de Tokens" />
            <button id="sellBtn" disabled style="width:100%; background:#ff6b6b;">Vender por SOL</button>

            <p id="tradeStatus" class="status"></p>
        </div>
    </div>

    <!-- IMPORT MAP -->
    <script type="importmap">
        {
            "imports": {
                "@solana/web3.js": "https://esm.sh/@solana/web3.js@1.98.0",
                "@nirholas/pump-sdk": "https://esm.sh/@nirholas/pump-sdk@latest",
                "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2",
                "bn.js": "https://esm.sh/bn.js@5"
            }
        }
    </script>

    <script type="module">
        const SUPABASE_URL = 'https://dzqoxbdnysxqylvwluzz.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_R6Hb2unSpr4ssW9Cl_9VkA_KyfZzIux';

        import { Connection, PublicKey, Keypair, LAMPORTS_PER_SOL, VersionedTransaction, TransactionMessage, ComputeBudgetProgram } from '@solana/web3.js';
        import { OnlinePumpSdk, PUMP_SDK, getBuyTokenAmountFromSolAmount, getSellSolAmountFromTokenAmount, newBondingCurve } from '@nirholas/pump-sdk';
        import { createClient } from '@supabase/supabase-js';
        import BN from 'bn.js';

        const connection = new Connection('https://devnet.helius-rpc.com/?api-key=f600a1bb-1023-469b-8b21-1f424fe50931', 'confirmed');
        const onlineSdk = new OnlinePumpSdk(connection);
        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let wallet = null;
        let userPublicKey = null;
        let currentMint = null;
        let activeImageUrl = null;

        const canvas = document.getElementById('chartCanvas');
        const ctx = canvas.getContext('2d');

        // --- SISTEMA DE JWT GUARDADO ---
        const jwtInput = document.getElementById('pinataJwt');
        const savedJwt = localStorage.getItem('pinata_jwt');
        if (savedJwt) {
            jwtInput.value = savedJwt;
            jwtInput.type = 'text';
            jwtInput.style.color = '#14F195';
        }

        document.getElementById('saveJwtBtn').addEventListener('click', () => {
            const val = jwtInput.value.trim();
            if (val) {
                localStorage.setItem('pinata_jwt', val);
                jwtInput.style.color = '#14F195';
                alert('✅ JWT guardado en el navegador. No tendrás que pegarlo de nuevo.');
            }
        });

        // --- ACTUALIZAR BALANCE ---
        async function updateWalletBalance() {
            if (!userPublicKey) return;
            try {
                const balance = await connection.getBalance(userPublicKey);
                document.getElementById('walletBalance').textContent = `${(balance / LAMPORTS_PER_SOL).toFixed(3)} SOL`;
            } catch (e) { console.warn('Error obteniendo balance', e); }
        }

        // 1. Conectar Wallet
        document.getElementById('connectBtn').addEventListener('click', async () => {
            if (!window.solana || !window.solana.isPhantom) return alert('Instala Phantom y ponlo en Devnet.');
            try {
                const resp = await window.solana.connect();
                userPublicKey = resp.publicKey;
                wallet = window.solana;
                document.getElementById('walletStatus').textContent = `Conectado`;
                document.getElementById('connectBtn').style.display = 'none';
                ['createTokenBtn', 'buyBtn', 'sellBtn', 'loadTokenBtn'].forEach(id => document.getElementById(id).disabled = false);
                await updateWalletBalance();
            } catch (err) {
                document.getElementById('walletStatus').textContent = `Error: ${err.message}`;
                document.getElementById('walletStatus').classList.add('error');
            }
        });

        // Previsualización de imagen local
        document.getElementById('tokenImage').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                activeImageUrl = URL.createObjectURL(file);
                document.getElementById('tokenImagePreview').src = activeImageUrl;
            }
        });

        // 2. Subir IPFS
        async function uploadToPinata(jwt, file, name, symbol) {
            const imgForm = new FormData();
            imgForm.append('file', file);
            const imgRes = await fetch('https://api.pinata.cloud/pinning/pinFileToIPFS', {
                method: 'POST', headers: { Authorization: `Bearer ${jwt}` }, body: imgForm,
            });
            if (!imgRes.ok) throw new Error('Error subiendo imagen. Revisa tu JWT.');
            const imgData = await imgRes.json();
            const imageUri = `https://gateway.pinata.cloud/ipfs/${imgData.IpfsHash}`;

            const metadata = { name, symbol, image: imageUri, description: '' };
            const metaForm = new FormData();
            metaForm.append('file', new Blob([JSON.stringify(metadata)], { type: 'application/json' }), 'metadata.json');
            const metaRes = await fetch('https://api.pinata.cloud/pinning/pinFileToIPFS', {
                method: 'POST', headers: { Authorization: `Bearer ${jwt}` }, body: metaForm,
            });
            if (!metaRes.ok) throw new Error('Error subiendo metadata a Pinata.');
            const metaData = await metaRes.json();
            return `https://gateway.pinata.cloud/ipfs/${metaData.IpfsHash}`;
        }

        // 3. Crear Token (Paso 1: createV2Instruction) + Compra Inicial (Paso 2)
        document.getElementById('createTokenBtn').addEventListener('click', async () => {
            const statusEl = document.getElementById('createStatus');
            statusEl.textContent = 'Subiendo a IPFS...'; statusEl.classList.remove('error');
            try {
                const jwt = jwtInput.value.trim();
                const name = document.getElementById('tokenName').value.trim();
                const symbol = document.getElementById('tokenSymbol').value.trim();
                const imgFile = document.getElementById('tokenImage').files[0];
                
                if (!jwt) throw new Error('Falta el JWT de Pinata.');
                if (!name || !symbol || !imgFile) throw new Error('Llena todos los campos e imagen.');

                const metadataUri = await uploadToPinata(jwt, imgFile, name, symbol);
                statusEl.textContent = 'Paso 1/2: Creando token en la curva...';

                const mintKeypair = Keypair.generate();
                const global = await onlineSdk.fetchGlobal();
                const feeConfig = await onlineSdk.fetchFeeConfig();

                // PASO 1: Crear el token SIN compra usando createV2Instruction.
                // Pasamos correctamente 'creator' y 'user' para evitar el error del Provider.
                const createIx = await PUMP_SDK.createV2Instruction({
                    global,
                    feeConfig,
                    mint: mintKeypair.publicKey,
                    name,
                    symbol,
                    uri: metadataUri,
                    creator: userPublicKey,
                    user: userPublicKey,
                    mayhemMode: false,
                    cashback: false
                });

                const { blockhash: bh1, lastValidBlockHeight: lvb1 } = await connection.getLatestBlockhash('confirmed');
                const messageV0 = new TransactionMessage({
                    payerKey: userPublicKey,
                    recentBlockhash: bh1,
                    instructions: [createIx], // Solo la instrucción de creación
                }).compileToV0Message();

                const tx = new VersionedTransaction(messageV0);
                tx.sign([mintKeypair]);

                const signed = await wallet.signTransaction(tx);
                const txId = await connection.sendRawTransaction(signed.serialize());
                await connection.confirmTransaction({ signature: txId, blockhash: bh1, lastValidBlockHeight: lvb1 }, 'confirmed');

                const mintAddress = mintKeypair.publicKey.toBase58();
                statusEl.textContent = `✅ Token creado. Paso 2/2: Ejecutando compra inicial...`;

                // PASO 2: Compra inicial (0.01 SOL) en una transacción separada.
                const solToSpend = new BN(0.01 * LAMPORTS_PER_SOL);
                const initialCurve = newBondingCurve(global);
                const tokensOut = getBuyTokenAmountFromSolAmount({ global, feeConfig, mintSupply: null, bondingCurve: initialCurve, amount: solToSpend });

                const buyState = await onlineSdk.fetchBuyState(mintKeypair.publicKey, userPublicKey);
                
                const buyInstructions = await onlineSdk.buyInstructions({
                    ...buyState,
                    mint: mintKeypair.publicKey,
                    user: userPublicKey,
                    amount: tokensOut,
                    solAmount: solToSpend,
                    slippage: 0.05
                });

                const { blockhash: bh2, lastValidBlockHeight: lvb2 } = await connection.getLatestBlockhash('confirmed');
                const messageV0Buy = new TransactionMessage({
                    payerKey: userPublicKey,
                    recentBlockhash: bh2,
                    instructions: buyInstructions,
                }).compileToV0Message();

                const txBuy = new VersionedTransaction(messageV0Buy);
                const signedBuy = await wallet.signTransaction(txBuy);
                const txIdBuy = await connection.sendRawTransaction(signedBuy.serialize());
                await connection.confirmTransaction({ signature: txIdBuy, blockhash: bh2, lastValidBlockHeight: lvb2 }, 'confirmed');

                // Actualizar UI
                statusEl.textContent = `✅ Token y compra inicial completados.\nMint: ${mintAddress}`;
                document.getElementById('mintAddressInput').value = mintAddress;
                document.getElementById('displayName').textContent = name;
                document.getElementById('displaySymbol').textContent = symbol;
                document.getElementById('tokenImagePreview').src = activeImageUrl;
                document.getElementById('tokenDisplay').style.display = 'block';
                
                await loadTokenData(mintAddress);
                await updateWalletBalance();
                
                supabase.from('launchpad_tokens').insert([{ mint_address: mintAddress, name, symbol, metadata_uri: metadataUri, creator_wallet: userPublicKey.toBase58() }]).catch(()=>{});
            } catch (err) {
                statusEl.textContent = `❌ ${err.message}`; statusEl.classList.add('error');
                console.error(err);
            }
        });

        // 4. Cargar Datos (Precio Formateado Limpio)
        document.getElementById('loadTokenBtn').addEventListener('click', () => loadTokenData(document.getElementById('mintAddressInput').value.trim()));

        async function loadTokenData(mintStr) {
            if (!mintStr) return;
            try {
                currentMint = new PublicKey(mintStr);
                const bondingCurve = await onlineSdk.fetchBondingCurve(currentMint);
                
                const vSol = bondingCurve.virtualQuoteReserves ? bondingCurve.virtualQuoteReserves : bondingCurve.virtualSolReserves;
                const vToken = bondingCurve.virtualTokenReserves;
                
                if (!vSol || !vToken) throw new Error('Formato de bonding curve no reconocido.');

                const mcapLamports = vSol.mul(bondingCurve.tokenTotalSupply).div(vToken);
                const mcapSol = mcapLamports.toNumber() / LAMPORTS_PER_SOL;
                const progressPct = Math.min((mcapSol / 69) * 100, 100);
                
                const priceSol = (vSol.toNumber() / 1e9) / (vToken.toNumber() / 1e6);
                
                let priceStr = priceSol.toFixed(8); 
                priceStr = priceStr.replace(/0+$/, '').replace(/\.$/, ''); 

                document.getElementById('mcap').textContent = `${mcapSol.toFixed(2)} SOL`;
                document.getElementById('price').textContent = `${priceStr} SOL`;
                document.getElementById('progress').textContent = `${progressPct.toFixed(1)}%`;
                document.getElementById('tokenDisplay').style.display = 'block';

                if (bondingCurve.complete) document.getElementById('graduatedBadge').style.display = 'block';

                drawChart(mcapSol);
            } catch (e) {
                alert(`Error: ${e.message}`);
            }
        }

        function drawChart(currentMcap) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const w = canvas.width, h = canvas.height;
            const maxTarget = 69; 
            const ptX = (Math.min(currentMcap, maxTarget) / maxTarget) * (w - 40) + 20;
            const ptY = h - 20 - (Math.min(currentMcap, maxTarget) / maxTarget) * (h - 40);

            ctx.beginPath(); ctx.strokeStyle = '#333'; ctx.lineWidth = 2;
            ctx.moveTo(20, h - 20); ctx.quadraticCurveTo(w / 2, h - 20, w - 20, 20); ctx.stroke();

            ctx.beginPath(); ctx.fillStyle = '#14F195'; ctx.arc(ptX, ptY, 5, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#888'; ctx.font = '11px monospace';
            ctx.fillText(`${currentMcap.toFixed(2)} SOL`, ptX - 20, ptY - 10);
        }

        // 5. Compra Rápida
        window.setSolAmount = (val) => { document.getElementById('solAmount').value = val; };

        document.getElementById('buyBtn').addEventListener('click', async () => {
            const statusEl = document.getElementById('tradeStatus'); statusEl.textContent = 'Firmando compra...'; statusEl.classList.remove('error');
            try {
                if (!currentMint) throw new Error('Carga un token primero.');
                const solInput = parseFloat(document.getElementById('solAmount').value);
                if (!solInput || solInput <= 0) throw new Error('SOL inválido.');

                const solAmount = new BN(Math.floor(solInput * LAMPORTS_PER_SOL));
                const buyState = await onlineSdk.fetchBuyState(currentMint, userPublicKey);
                const global = await onlineSdk.fetchGlobal();
                const feeConfig = await onlineSdk.fetchFeeConfig();

                const amount = getBuyTokenAmountFromSolAmount({ global, feeConfig, mintSupply: buyState.bondingCurve.tokenTotalSupply, bondingCurve: buyState.bondingCurve, amount: solAmount });
                
                const instructions = await onlineSdk.buyInstructions({ ...buyState, mint: currentMint, user: userPublicKey, amount, solAmount, slippage: 0.05 });

                instructions.push(
                    ComputeBudgetProgram.setComputeUnitLimit({ units: 1000000 }),
                    ComputeBudgetProgram.setComputeUnitPrice({ microLamports: 100000 })
                );

                const { blockhash, lastValidBlockHeight } = await connection.getLatestBlockhash('confirmed');
                const messageV0 = new TransactionMessage({
                    payerKey: userPublicKey,
                    recentBlockhash: blockhash,
                    instructions: instructions,
                }).compileToV0Message();

                const tx = new VersionedTransaction(messageV0);
                const signed = await wallet.signTransaction(tx);
                
                const sig = await connection.sendRawTransaction(signed.serialize());
                await connection.confirmTransaction({ signature: sig, blockhash, lastValidBlockHeight }, 'confirmed');
                
                statusEl.textContent = `✅ Compra OK. Tx: ${sig.substring(0, 15)}...`;
                await loadTokenData(currentMint.toBase58());
                await updateWalletBalance();
            } catch (err) {
                statusEl.textContent = `❌ ${err.message}`; statusEl.classList.add('error');
                console.error(err);
            }
        });

        // 6. Venta
        document.getElementById('sellBtn').addEventListener('click', async () => {
            const statusEl = document.getElementById('tradeStatus'); statusEl.textContent = 'Firmando venta...'; statusEl.classList.remove('error');
            try {
                if (!currentMint) throw new Error('Carga un token primero.');
                const tokenInput = parseFloat(document.getElementById('tokenAmountToSell').value);
                if (!tokenInput || tokenInput <= 0) throw new Error('Cantidad inválida.');

                const amount = new BN(Math.floor(tokenInput * 1_000_000));
                const sellState = await onlineSdk.fetchSellState(currentMint, userPublicKey);
                const global = await onlineSdk.fetchGlobal();
                const feeConfig = await onlineSdk.fetchFeeConfig();

                const solAmount = getSellSolAmountFromTokenAmount({ global, feeConfig, mintSupply: sellState.bondingCurve.tokenTotalSupply, bondingCurve: sellState.bondingCurve, amount });
                
                const instructions = await PUMP_SDK.sellInstructions({ ...sellState, mint: currentMint, user: userPublicKey, amount, solAmount, slippage: 0.05 });

                instructions.push(
                    ComputeBudgetProgram.setComputeUnitLimit({ units: 1000000 }),
                    ComputeBudgetProgram.setComputeUnitPrice({ microLamports: 100000 })
                );

                const { blockhash, lastValidBlockHeight } = await connection.getLatestBlockhash('confirmed');
                const messageV0 = new TransactionMessage({
                    payerKey: userPublicKey,
                    recentBlockhash: blockhash,
                    instructions: instructions,
                }).compileToV0Message();

                const tx = new VersionedTransaction(messageV0);
                const signed = await wallet.signTransaction(tx);
                
                const sig = await connection.sendRawTransaction(signed.serialize());
                await connection.confirmTransaction({ signature: sig, blockhash, lastValidBlockHeight }, 'confirmed');
                
                statusEl.textContent = `✅ Venta OK. Tx: ${sig.substring(0, 15)}...`;
                await loadTokenData(currentMint.toBase58());
                await updateWalletBalance();
            } catch (err) {
                statusEl.textContent = `❌ ${err.message}`; statusEl.classList.add('error');
                console.error(err);
            }
        });
    </script>
</body>
</html>
