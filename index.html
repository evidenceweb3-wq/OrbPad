<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Epic ORB Launchpad</title>
  <script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    :root {
      --bg-dark: #0d0d0f;
      --panel-bg: #16161a;
      --border: #2a2a32;
      --purple: #9945FF;
      --green: #14F195;
      --red: #ff4d4d;
      --text-muted: #8b8b9a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', 'Segoe UI', sans-serif; }
    body { background-color: var(--bg-dark); color: #fff; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
    
    header { height: 60px; display: flex; justify-content: space-between; align-items: center; padding: 0 24px; background: var(--panel-bg); border-bottom: 1px solid var(--border); z-index: 10; }
    header h1 { font-size: 1.2rem; color: var(--green); display: flex; align-items: center; gap: 8px; }
    #login-btn { background: var(--purple); color: white; padding: 8px 16px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; transition: 0.2s; }
    #login-btn:hover { opacity: 0.8; }

    .app-layout { display: grid; grid-template-columns: 380px 1fr; flex: 1; height: calc(100vh - 60px); overflow: hidden; }
    .sidebar { background: var(--panel-bg); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 20px; gap: 20px; overflow-y: auto; }
    .card { background: var(--bg-dark); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
    .card h3 { font-size: 0.9rem; margin-bottom: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
    
    .input-group { margin-bottom: 12px; }
    .input-group label { display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 4px; }
    .input-group input { width: 100%; background: var(--panel-bg); border: 1px solid var(--border); color: white; padding: 10px; border-radius: 6px; font-size: 0.9rem; outline: none; }
    .input-group input:focus { border-color: var(--purple); }
    
    .btn-primary { width: 100%; background: var(--green); color: #000; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; margin-top: 8px; }
    .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn-primary:disabled { background: #555; cursor: not-allowed; }

    .btn-nonce { width: 100%; background: var(--purple); color: white; padding: 10px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-bottom: 10px; font-size: 0.85rem;}

    .token-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
    .token-item { display: flex; align-items: center; justify-content: space-between; padding: 10px; background: var(--panel-bg); border: 1px solid var(--border); border-radius: 8px; cursor: pointer; transition: 0.2s; }
    .token-item:hover { border-color: var(--purple); }
    .token-item.active { border-color: var(--green); background: rgba(20, 241, 149, 0.05); }
    .token-info { display: flex; align-items: center; gap: 10px; }
    .token-info img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; }
    .token-info h4 { font-size: 0.9rem; margin: 0; }
    .token-info p { font-size: 0.75rem; color: var(--text-muted); margin: 0; }

    .main-content { display: flex; flex-direction: column; padding: 20px; gap: 20px; overflow: hidden; }
    .token-header { display: flex; justify-content: space-between; align-items: center; background: var(--panel-bg); padding: 16px; border-radius: 12px; border: 1px solid var(--border); }
    .token-title { display: flex; align-items: center; gap: 16px; }
    .token-title img { width: 48px; height: 48px; border-radius: 50%; border: 2px solid var(--green); }
    .token-title h2 { font-size: 1.5rem; margin: 0; }
    .token-title span { font-size: 0.9rem; color: var(--text-muted); }
    
    .stats { display: flex; gap: 32px; }
    .stat-item { display: flex; flex-direction: column; }
    .stat-item span:first-child { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; }
    .stat-item span:last-child { font-size: 1.2rem; font-weight: bold; color: var(--green); }

    .chart-container { flex: 1; background: var(--panel-bg); border-radius: 12px; border: 1px solid var(--border); position: relative; overflow: hidden; }
    .trade-panel { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; background: var(--panel-bg); padding: 16px; border-radius: 12px; border: 1px solid var(--border); }
    .trade-inputs { display: flex; gap: 12px; grid-column: span 2; }
    .trade-inputs .input-group { flex: 1; margin: 0; }
    .trade-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; grid-column: span 2; }
    .btn-buy { background: var(--green); color: #000; padding: 14px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
    .btn-sell { background: var(--red); color: #fff; padding: 14px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }

    /* Toasts */
    #toast { position: fixed; top: 80px; left: 50%; transform: translateX(-50%); padding: 12px 24px; border-radius: 8px; font-weight: 600; font-size: 0.9rem; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 1000; }
    #toast.show { opacity: 1; }
    #toast.info { background: #1e2a3a; color: #58a6ff; border: 1px solid #58a6ff; }
    #toast.success { background: #1e3a2b; color: var(--green); border: 1px solid var(--green); }
    #toast.error { background: #3a1e1e; color: var(--red); border: 1px solid var(--red); }

    /* Error Box */
    #error-box { position: fixed; bottom: 0; left: 0; width: 100%; background: #1a0000; border-top: 2px solid var(--red); color: var(--red); font-family: monospace; font-size: 0.85rem; max-height: 150px; overflow-y: auto; display: none; z-index: 2000; }
    .error-header { display: flex; justify-content: space-between; padding: 8px 16px; background: #2a0000; font-weight: bold; border-bottom: 1px solid #440000; }
    .error-header button { background: transparent; color: var(--red); border: none; cursor: pointer; font-weight: bold; font-size: 1rem; }
    #error-content { padding: 12px 16px; white-space: pre-wrap; line-height: 1.4; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <header>
    <h1>🚀 Epic ORB Launchpad</h1>
    <button id="login-btn">🔐 Conectar Wallet</button>
  </header>

  <div id="app-layout" class="app-layout hidden">
    
    <div class="sidebar">
      
      <!-- SECCIÓN NUEVA: IMPORTAR TOKEN -->
      <div class="card">
        <h3>📥 Importar Token</h3>
        <p style="font-size:0.75rem; color:var(--text-muted); margin-bottom:10px;">Pega la dirección Genesis y el Mint de un token creado ayer.</p>
        <div class="input-group">
          <label>Genesis Address</label>
          <input type="text" id="import-genesis" placeholder="Ej: GxY...">
        </div>
        <div class="input-group">
          <label>Base Mint</label>
          <input type="text" id="import-mint" placeholder="Ej: 4kL...">
        </div>
        <button id="import-btn" class="btn-primary" style="background: var(--purple); color: white;">Cargar Token</button>
      </div>

      <div class="card">
        <h3>⚙️ Configurar Nonce</h3>
        <button id="setup-nonce-btn" class="btn-nonce">Generar Nonce (Opcional)</button>
        <div class="input-group" style="margin-top:10px;">
          <input type="text" id="nonce-address" placeholder="Nonce..." readonly style="display:none;">
        </div>
      </div>

      <div class="card">
        <h3>✨ Crear Lanzamiento</h3>
        <div class="input-group">
          <label>Nombre</label>
          <input type="text" id="token-name" placeholder="Ej: Epic ORB" value="Epic ORB">
        </div>
        <div class="input-group">
          <label>Símbolo</label>
          <input type="text" id="token-symbol" placeholder="Ej: EORB" value="EORB">
        </div>
        <div class="input-group">
          <label>Logo</label>
          <input type="file" id="logo-input" accept="image/png, image/jpeg">
        </div>
        <button id="create-btn" class="btn-primary" disabled>Lanzar Token (0.1 SOL)</button>
      </div>

      <div class="card" style="flex: 1; display: flex; flex-direction: column;">
        <h3>📚 Mis Tokens (DB)</h3>
        <div id="token-list" class="token-list">
          <p style="color:var(--text-muted); font-size:0.85rem; text-align:center; margin-top:20px;">No hay tokens.</p>
        </div>
      </div>
    </div>

    <div class="main-content">
      <div class="token-header">
        <div class="token-title">
          <img id="active-img" src="https://via.placeholder.com/48" alt="Token">
          <div>
            <h2 id="active-name">Selecciona o Importa</h2>
            <span id="active-symbol">---</span>
          </div>
        </div>
        <div class="stats">
          <div class="stat-item">
            <span>Precio</span>
            <span id="active-price">0.0000 SOL</span>
          </div>
          <div class="stat-item">
            <span>Market Cap</span>
            <span id="active-mcap">$0</span>
          </div>
        </div>
      </div>

      <div id="chart" class="chart-container"></div>

      <div class="trade-panel">
        <div class="trade-inputs">
          <div class="input-group">
            <label>Cantidad (SOL / Tokens)</label>
            <input type="number" id="trade-amount" placeholder="0.1" step="0.01" value="0.1">
          </div>
          <div class="input-group">
            <label>Slippage (%)</label>
            <input type="number" id="slippage" value="1" min="0.1" max="50" step="0.1">
          </div>
        </div>
        <div class="trade-actions">
          <button id="buy-btn" class="btn-buy">🟢 Comprar</button>
          <button id="sell-btn" class="btn-sell">🔴 Vender</button>
        </div>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <div id="error-box">
    <div class="error-header">
      <span>❌ Error Detectado</span>
      <button onclick="document.getElementById('error-box').style.display='none'">Cerrar [X]</button>
    </div>
    <div id="error-content"></div>
  </div>

  <script type="module">
    import { Buffer } from 'https://esm.sh/buffer@6.0.3';
    window.Buffer = Buffer;
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.39.3';
    import { createUmi } from 'https://esm.sh/@metaplex-foundation/umi-bundle-defaults@1.6.0';
    import { walletAdapterIdentity } from 'https://esm.sh/@metaplex-foundation/umi-signer-wallet-adapters@1.6.0';
    import { publicKey, sol, transactionBuilder } from 'https://esm.sh/@metaplex-foundation/umi@1.6.0';
    import { mplToolbox, createTokenIfMissing, findAssociatedTokenPda, transferSol, syncNative, closeToken } from 'https://esm.sh/@metaplex-foundation/mpl-toolbox@0.11.4';

    const SUPABASE_URL = 'https://zebmhlnqlkmwfgvfivmc.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_geHNN8tkjCA6BWmlMukJYQ_PFIpRAFB';
    const MI_DIRECCION_ORB = 'DeQ2hgNRnFTm1dDp9CKSdiGqbhMwoy2sjP6cqTkFWorb';
    const RPC = 'https://devnet.helius-rpc.com/?api-key=f600a1bb-1023-469b-8b21-1f424fe50931';

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    let umi = null, currentGenesis = null, currentBaseMint = null, candleSeries = null;

    const toast = document.getElementById('toast');
    function showToast(msg, type) {
      toast.textContent = msg; toast.className = `show ${type}`;
      setTimeout(() => toast.className = '', 4000);
      if(type === 'error') logError(msg);
    }

    function logError(msg) {
      const box = document.getElementById('error-box');
      const content = document.getElementById('error-content');
      box.style.display = 'block';
      content.textContent = `[${new Date().toLocaleTimeString()}] ${msg}\n${content.textContent}`;
    }

    // 1. LOGIN
    document.getElementById('login-btn').addEventListener('click', async () => {
      const provider = window.phantom?.solana || window.solana;
      if (!provider?.isPhantom) return showToast('Instala Phantom.', 'error');
      
      try {
        await supabase.auth.signOut(); 
        await provider.connect();
        
        const { error } = await supabase.auth.signInWithWeb3({
          chain: 'solana', 
          statement: 'I accept the terms of service.', 
          wallet: provider 
        });
        if (error) throw error;

        document.getElementById('login-btn').classList.add('hidden');
        document.getElementById('app-layout').classList.remove('hidden');

        umi = createUmi(RPC);
        umi.use(walletAdapterIdentity(provider));
        umi.use(mplToolbox());
        
        const { genesis } = await import('https://cdn.jsdelivr.net/npm/@metaplex-foundation/genesis@0.43.4/+esm');
        umi.use(genesis());
        
        const savedNonce = localStorage.getItem('orb_nonce');
        if (savedNonce) {
          document.getElementById('nonce-address').value = savedNonce;
          document.getElementById('create-btn').disabled = false;
        }

        loadTokens();
        showToast('✅ Conectado', 'success');
      } catch (err) { 
        console.error(err);
        showToast(err.message, 'error'); 
      }
    });

    // 2. IMPORTAR TOKEN
    document.getElementById('import-btn').addEventListener('click', async () => {
      if (!umi) return showToast('Conecta wallet primero.', 'error');
      
      const genesis = document.getElementById('import-genesis').value.trim();
      const mint = document.getElementById('import-mint').value.trim();

      if (!genesis || !mint) return showToast('Ingresa ambas direcciones.', 'error');

      try {
        currentGenesis = genesis;
        currentBaseMint = mint;

        // Actualizar UI
        document.getElementById('active-img').src = "https://via.placeholder.com/48";
        document.getElementById('active-name').textContent = "Token Importado";
        document.getElementById('active-symbol').textContent = "IMP";

        showToast('Cargando datos de la curva...', 'info');
        
        // Forzar la actualización de stats y gráfico
        await updateStats(currentGenesis);
        await updateChart(currentGenesis);
        
        showToast('✅ Token cargado. Puedes comprar/vender.', 'success');
      } catch (e) {
        showToast('Error al importar: ' + e.message, 'error');
      }
    });

    // 3. CREAR NONCE
    document.getElementById('setup-nonce-btn').addEventListener('click', async () => {
      if (!umi) return showToast('Conecta wallet primero.', 'error');
      const btn = document.getElementById('setup-nonce-btn');
      btn.disabled = true; btn.textContent = 'Generando...';

      try {
        showToast('Firmando creación de Nonce...', 'info');
        const { Connection, Keypair, SystemProgram, Transaction, LAMPORTS_PER_SOL, PublicKey } = await import('https://esm.sh/@solana/web3.js@1.95.3');
        
        const connection = new Connection(RPC, 'confirmed');
        const nonceKeypair = Keypair.generate();
        const fromPubkey = new PublicKey(umi.identity.publicKey.toString());

        const tx = new Transaction().add(
          SystemProgram.createNonceAccount({
            fromPubkey: fromPubkey,
            noncePubkey: nonceKeypair.publicKey,
            authorizedPubkey: fromPubkey,
            lamports: 0.0015 * LAMPORTS_PER_SOL,
          })
        );

        const { blockhash } = await connection.getLatestBlockhash();
        tx.recentBlockhash = blockhash;
        tx.feePayer = fromPubkey;
        tx.partialSign(nonceKeypair);
        
        const provider = window.phantom?.solana || window.solana;
        const signedTx = await provider.signTransaction(tx);
        
        const signature = await connection.sendRawTransaction(signedTx.serialize());
        await connection.confirmTransaction(signature, 'confirmed');
        
        const nonceStr = nonceKeypair.publicKey.toString();
        localStorage.setItem('orb_nonce', nonceStr);
        
        document.getElementById('nonce-address').value = nonceStr;
        document.getElementById('create-btn').disabled = false;
        
        showToast('✅ Nonce creado y guardado', 'success');
      } catch (error) {
        console.error(error);
        showToast('Error creando nonce: ' + error.message, 'error');
        btn.disabled = false; btn.textContent = 'Generar Nonce (Opcional)';
      }
    });

    // 4. LOAD TOKENS
    async function loadTokens() {
      const { data } = await supabase.from('launches').select('*').order('created_at', { ascending: false });
      const list = document.getElementById('token-list');
      list.innerHTML = (data && data.length) ? '' : '<p style="color:#888;text-align:center;">No hay tokens en DB.</p>';
      
      if(!data) return;
      data.forEach(t => {
        const div = document.createElement('div');
        div.className = 'token-item';
        div.innerHTML = `
          <div class="token-info">
            <img src="${t.token_image_url}">
            <div><h4>${t.token_name}</h4><p>${t.token_symbol}</p></div>
          </div>
          <span style="color:var(--green); font-size:0.8rem;">Ver</span>
        `;
        div.onclick = () => selectToken(t, div);
        list.appendChild(div);
      });
    }

    // 5. SELECT TOKEN
    async function selectToken(token, el) {
      document.querySelectorAll('.token-item').forEach(e => e.classList.remove('active'));
      el.classList.add('active');
      currentGenesis = token.genesis_address;
      currentBaseMint = token.base_mint;

      document.getElementById('active-img').src = token.token_image_url;
      document.getElementById('active-name').textContent = token.token_name;
      document.getElementById('active-symbol').textContent = token.token_symbol;

      updateStats(currentGenesis);
      updateChart(currentGenesis);
    }

    // 6. CREATE TOKEN (Con Reintentos)
    document.getElementById('create-btn').addEventListener('click', async () => {
      if (!umi) return showToast('Conecta wallet.', 'error');
      const file = document.getElementById('logo-input').files[0];
      if (!file) return showToast('Sube un logo.', 'error');
      
      const nonceAddress = document.getElementById('nonce-address').value;
      if (!nonceAddress) return showToast('Genera el Nonce primero.', 'error');

      const btn = document.getElementById('create-btn');
      btn.disabled = true; btn.textContent = 'Creando...';

      try {
        showToast('Subiendo imagen...', 'info');
        const reader = new FileReader();
        const b64 = await new Promise(r => { reader.onload = e => r(e.target.result.split(',')[1]); reader.readAsDataURL(file); });
        const { data: up, error: upErr } = await supabase.functions.invoke('upload-to-irys', { body: { fileBase64: b64, fileName: file.name, fileType: file.type } });
        if (upErr) throw upErr;

        showToast('Preparando lanzamiento...', 'info');
        const { createAndRegisterLaunch } = await import('https://cdn.jsdelivr.net/npm/@metaplex-foundation/genesis@0.43.4/+esm');
        
        const launchInput = {
          wallet: umi.identity.publicKey,
          network: 'solana-devnet',
          token: { name: document.getElementById('token-name').value, symbol: document.getElementById('token-symbol').value, image: up.url },
          launchType: 'bondingCurve',
          launch: { firstBuyAmount: 0.1 },
        };

        const batchTxSender = async (txs) => {
          showToast('👉 Aprueba en Phantom', 'info');
          const signedTxs = await umi.identity.signAllTransactions(txs);
          const signatures = await Promise.all(
            signedTxs.map(tx => umi.rpc.sendTransaction(tx, { skipPreflight: true, preflightCommitment: 'processed' }))
          );
          const lastIdx = signedTxs.length - 1;
          await umi.rpc.confirmTransaction({
            signature: signatures[lastIdx],
            blockhash: signedTxs[lastIdx].message.recentBlockhash,
            lastValidBlockHeight: signedTxs[lastIdx].message.lastValidBlockHeight,
          }, { commitment: 'confirmed' });
          return signatures;
        };

        let res;
        let maxRetries = 3;
        
        for (let attempt = 1; attempt <= maxRetries; attempt++) {
          try {
            res = await createAndRegisterLaunch(umi, { txSender: batchTxSender }, launchInput);
            break; 
          } catch (err) {
            if (err.message?.includes('Blockhash') && attempt < maxRetries) {
              showToast(`Red lenta, reintentando (${attempt}/${maxRetries})...`, 'info');
              await new Promise(r => setTimeout(r, 3000));
            } else {
              throw err;
            }
          }
        }
        
        await supabase.from('launches').insert({
          authority: MI_DIRECCION_ORB, token_name: launchInput.token.name, token_symbol: launchInput.token.symbol,
          token_image_url: up.url, genesis_address: res.genesisAccount.toString(), base_mint: res.mintAddress.toString()
        });

        showToast('🚀 ¡Token creado!', 'success');
        loadTokens();
      } catch (err) {
        console.error(err);
        showToast(err.message || 'Error al crear', 'error');
      } finally {
        btn.disabled = false; btn.textContent = 'Lanzar Token (0.1 SOL)';
      }
    });

    // 7. UPDATE STATS
    async function updateStats(genesis) {
      try {
        const { findBondingCurveBucketV2Pda, fetchBondingCurveBucketV2 } = await import('https://cdn.jsdelivr.net/npm/@metaplex-foundation/genesis@0.43.4/+esm');
        const [bucketPda] = findBondingCurveBucketV2Pda(umi, { genesisAccount: publicKey(genesis), bucketIndex: 0 });
        const bucket = await fetchBondingCurveBucketV2(umi, bucketPda);
        if (bucket) {
          const sol = (Number(bucket.virtualSol) + Number(bucket.realSol)) / 1e9;
          const tokens = (Number(bucket.virtualTokens) + Number(bucket.realTokens)) / 1e9;
          if (tokens > 0) {
            const price = sol / tokens;
            document.getElementById('active-price').textContent = price.toFixed(8) + ' SOL';
            document.getElementById('active-mcap').textContent = '$' + (price * 1_000_000_000).toLocaleString('en-US', { maximumFractionDigits: 0 });
          }
        }
      } catch (e) { console.warn('Stats err', e); }
    }

    // 8. CHART
    function initChart() {
      if (candleSeries) return;
      const chart = LightweightCharts.createChart(document.getElementById('chart'), {
        layout: { background: { color: 'transparent' }, textColor: '#ccc' },
        grid: { vertLines: { color: '#222' }, horzLines: { color: '#222' } },
      });
      candleSeries = chart.addCandlestickSeries({ upColor: '#14F195', downColor: '#ff4d4d', borderVisible: false, wickUpColor: '#14F195', wickDownColor: '#ff4d4d' });
    }

    async function updateChart(genesis) {
      if (!candleSeries) initChart();
      const { data } = await supabase.from('bond_swaps').select('block_time, price').eq('genesis_address', genesis).order('block_time', { ascending: true });
      const candles = new Map();
      (data || []).forEach(s => {
        const b = Math.floor(s.block_time / 3600) * 3600;
        if (!candles.has(b)) candles.set(b, { time: b, open: s.price, high: s.price, low: s.price, close: s.price });
        else { const c = candles.get(b); c.high = Math.max(c.high, s.price); c.low = Math.min(c.low, s.price); c.close = s.price; }
      });
      candleSeries.setData(Array.from(candles.values()));
    }

    // 9. TRADE
    async function executeTrade(type) {
      if (!umi || !currentGenesis) return showToast('Selecciona un token.', 'error');
      const amount = parseFloat(document.getElementById('trade-amount').value);
      const slip = parseFloat(document.getElementById('slippage').value) * 100;
      
      try {
        showToast(type === 'buy' ? 'Comprando...' : 'Vendiendo...', 'info');
        const { swapBondingCurveV2, getSwapResult, applySlippage, findBondingCurveBucketV2Pda, fetchBondingCurveBucketV2, SwapDirection } = await import('https://cdn.jsdelivr.net/npm/@metaplex-foundation/genesis@0.43.4/+esm');
        
        const genKey = publicKey(currentGenesis), base = publicKey(currentBaseMint), quote = publicKey('So11111111111111111111111111111111111111112');
        const [bucketPda] = findBondingCurveBucketV2Pda(umi, { genesisAccount: genKey, bucketIndex: 0 });
        const bucket = await fetchBondingCurveBucketV2(umi, bucketPda);
        const dir = type === 'buy' ? SwapDirection.Buy : SwapDirection.Sell;
        
        const amountIn = BigInt(Math.floor(amount * 1e9));
        const quoteRes = getSwapResult(bucket, amountIn, dir);
        const minOut = applySlippage(quoteRes.amountOut, slip);

        const [uBase] = findAssociatedTokenPda(umi, { mint: base, owner: umi.identity.publicKey });
        const [uQuote] = findAssociatedTokenPda(umi, { mint: quote, owner: umi.identity.publicKey });

        if (type === 'buy') {
          await transactionBuilder()
            .add(createTokenIfMissing(umi, { mint: quote, token: uQuote, tokenProgram: publicKey('TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA') }))
            .add(transferSol(umi, { destination: uQuote, amount: sol(amount) }))
            .add(syncNative(umi, { account: uQuote }))
            .sendAndConfirm(umi);
        }

        await swapBondingCurveV2(umi, { genesisAccount: genKey, bucket: bucketPda, baseMint: base, quoteMint: quote, baseTokenAccount: uBase, quoteTokenAccount: uQuote, amount: quoteRes.amountIn, minAmountOutScaled: minOut, swapDirection: dir }).sendAndConfirm(umi);
        
        await supabase.from('bond_swaps').insert({ genesis_address: currentGenesis, block_time: Math.floor(Date.now()/1000), price: (type === 'buy' ? amount / (Number(quoteRes.amountOut)/1e9) : (Number(quoteRes.amountOut)/1e9) / amount) });
        
        showToast('✅ Trade Exitoso', 'success');
        updateStats(currentGenesis); updateChart(currentGenesis);

        if (type === 'buy') { try { await closeToken(umi, { account: uQuote, destination: umi.identity.publicKey, owner: umi.identity }).sendAndConfirm(umi); } catch(e){} }

      } catch (e) { 
        console.error(e);
        showToast('Error: ' + e.message, 'error'); 
      }
    }

    document.getElementById('buy-btn').onclick = () => executeTrade('buy');
    document.getElementById('sell-btn').onclick = () => executeTrade('sell');

  </script>
</body>
</html>
