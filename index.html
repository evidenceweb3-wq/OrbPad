<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Epic ORB Launchpad</title>
  <script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    :root {
      --bg-dark: #0f0f0f;
      --panel-bg: #1a1a1a;
      --border: #2a2a2a;
      --solana-purple: #9945FF;
      --solana-green: #14F195;
      --danger: #ff4d4d;
      --text-muted: #888;
    }
    
    body { 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
      background-color: var(--bg-dark); 
      color: #fff; 
      margin: 0; 
      height: 100vh; 
      display: flex; 
      flex-direction: column; 
      overflow: hidden; /* Evita el scroll */
    }

    /* Navbar Superior */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 30px;
      background: var(--panel-bg);
      border-bottom: 1px solid var(--border);
    }
    header h1 { margin: 0; font-size: 1.5rem; color: var(--solana-green); display: flex; align-items: center; gap: 10px; }
    #login-btn { 
      background: var(--solana-purple); color: white; padding: 10px 20px; border: none; border-radius: 8px; 
      font-weight: bold; cursor: pointer; transition: 0.3s;
    }
    #login-btn:hover { opacity: 0.8; transform: translateY(-2px); }

    /* Layout Principal (Grid) */
    .main-grid {
      display: grid;
      grid-template-columns: 350px 1fr;
      gap: 20px;
      padding: 20px;
      flex-grow: 1;
      height: calc(100vh - 70px);
      box-sizing: border-box;
    }

    /* Paneles */
    .panel {
      background: var(--panel-bg);
      border-radius: 12px;
      border: 1px solid var(--border);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      overflow-y: auto;
    }
    .panel h2 { margin: 0 0 10px 0; font-size: 1.2rem; color: #fff; border-bottom: 1px solid var(--border); padding-bottom: 10px;}

    /* Formularios */
    .input-group { display: flex; flex-direction: column; gap: 5px; }
    .input-group label { font-size: 0.85rem; color: var(--text-muted); }
    .input-group input { 
      background: #252525; border: 1px solid var(--border); color: white; 
      padding: 10px; border-radius: 8px; font-size: 1rem; outline: none; transition: 0.2s;
    }
    .input-group input:focus { border-color: var(--solana-purple); }

    .btn-primary { background: var(--solana-green); color: #000; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1rem; transition: 0.2s; margin-top: 10px;}
    .btn-primary:hover { opacity: 0.9; transform: translateY(-2px); }

    /* Sección de Trade */
    .trade-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px;}
    .btn-buy { background: var(--solana-green); color: #000; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
    .btn-sell { background: var(--danger); color: #fff; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }

    /* Lista de Lanzamientos */
    .launch-list { display: flex; flex-direction: column; gap: 10px; overflow-y: auto; max-height: 200px; }
    .launch-item { 
      background: #252525; padding: 10px; border-radius: 8px; border: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: 0.2s;
    }
    .launch-item:hover { border-color: var(--solana-purple); transform: translateX(5px); }
    .launch-item.active { border-color: var(--solana-green); background: rgba(20, 241, 149, 0.05); }

    /* Zona del Gráfico y Stats */
    .chart-area { display: flex; flex-direction: column; height: 100%; gap: 15px; }
    .token-header { display: flex; justify-content: space-between; align-items: center; background: #252525; padding: 15px; border-radius: 10px; border: 1px solid var(--border);}
    .token-stats { display: flex; gap: 30px; }
    .stat-box { display: flex; flex-direction: column; }
    .stat-box span:first-child { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; }
    .stat-box span:last-child { font-size: 1.2rem; font-weight: bold; color: var(--solana-green); }
    
    #chart-container { flex-grow: 1; background: #1a1a1a; border-radius: 10px; border: 1px solid var(--border); min-height: 300px; }

    /* Status Toast */
    #status {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      padding: 15px 30px; border-radius: 10px; font-weight: bold; font-size: 0.9rem;
      display: none; z-index: 1000; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    #status.info { background: #1e2a3a; color: #58a6ff; border: 1px solid #58a6ff; display: block;}
    #status.success { background: #1e3a2b; color: var(--solana-green); border: 1px solid var(--solana-green); display: block;}
    #status.error { background: #3a1e1e; color: var(--danger); border: 1px solid var(--danger); display: block;}

    /* Ocultar secciones */
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <header>
    <h1>🚀 Epic ORB Launchpad</h1>
    <button id="login-btn">🔐 Conectar Wallet</button>
  </header>

  <div id="app-content" class="main-grid hidden">
    
    <!-- Panel Izquierdo: Crear y Lista -->
    <div style="display: flex; flex-direction: column; gap: 20px; height: 100%;">
      
      <!-- Crear Token -->
      <div class="panel">
        <h2>✨ Crear Token</h2>
        <div class="input-group">
          <label>Nombre</label>
          <input type="text" id="token-name" placeholder="Ej: Epic ORB" value="Epic ORB">
        </div>
        <div class="input-group">
          <label>Símbolo</label>
          <input type="text" id="token-symbol" placeholder="Ej: EORB" value="EORB">
        </div>
        <div class="input-group">
          <label>Logo (PNG/JPG)</label>
          <input type="file" id="logo-input" accept="image/png, image/jpeg" style="font-size: 0.8rem;">
        </div>
        <button id="create-launch-btn" class="btn-primary">Crear Lanzamiento (0.1 SOL)</button>
      </div>

      <!-- Mis Lanzamientos -->
      <div class="panel" style="flex-grow: 1; overflow: hidden;">
        <h2>📚 Mis Lanzamientos</h2>
        <div id="launches-list" class="launch-list">
          <!-- Se llena con JS -->
        </div>
      </div>
    </div>

    <!-- Panel Derecho: Trade y Gráfico -->
    <div class="panel chart-area">
      
      <!-- Header del Token -->
      <div class="token-header">
        <div style="display: flex; align-items: center; gap: 15px;">
          <img id="active-token-img" src="https://via.placeholder.com/40" style="width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--solana-green);">
          <div>
            <h3 id="active-token-name" style="margin: 0; font-size: 1.2rem;">Selecciona un token</h3>
            <small id="active-token-symbol" style="color: var(--text-muted);">Ninguno</small>
          </div>
        </div>
        <div class="token-stats">
          <div class="stat-box">
            <span>Precio</span>
            <span id="active-token-price">0.0000 SOL</span>
          </div>
          <div class="stat-box">
            <span>Market Cap</span>
            <span id="active-token-mcap">$0</span>
          </div>
        </div>
      </div>

      <!-- Gráfico -->
      <div id="chart-container"></div>

      <!-- Controles de Trade -->
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; background: #252525; padding: 15px; border-radius: 10px; border: 1px solid var(--border);">
        <div class="input-group">
          <label>Cantidad (SOL o Tokens)</label>
          <input type="number" id="trade-amount" placeholder="0.1" step="0.01" value="0.1">
        </div>
        <div class="input-group">
          <label>Slippage (%)</label>
          <input type="number" id="slippage" value="1" min="0.1" max="50" step="0.1">
        </div>
        <div class="trade-buttons" style="grid-column: span 2;">
          <button id="buy-btn" class="btn-buy">🟢 Comprar</button>
          <button id="sell-btn" class="btn-sell">🔴 Vender</button>
        </div>
      </div>

    </div>
  </div>

  <div id="status" class="info"></div>

  <script type="module">
    import { Buffer } from 'https://esm.sh/buffer@6.0.3';
    window.Buffer = Buffer;
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.39.3';
    import { createUmi } from 'https://esm.sh/@metaplex-foundation/umi-bundle-defaults@1.6.0';
    import { walletAdapterIdentity } from 'https://esm.sh/@metaplex-foundation/umi-signer-wallet-adapters@1.6.0';
    import { publicKey, sol, transactionBuilder } from 'https://esm.sh/@metaplex-foundation/umi@1.6.0';
    import { mplToolbox, createTokenIfMissing, findAssociatedTokenPda, transferSol, syncNative, closeToken } from 'https://esm.sh/@metaplex-foundation/mpl-toolbox@0.11.4';

    // CONFIGURACIÓN
    const SUPABASE_URL = 'https://zebmhlnqlkmwfgvfivmc.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_geHNN8tkjCA6BWmlMukJYQ_PFIpRAFB';
    const MI_DIRECCION_ORB = 'DeQ2hgNRnFTm1dDp9CKSdiGqbhMwoy2sjP6cqTkFWorb';
    const FRONTEND_RPC = 'https://attentive-black-feather.solana-devnet.quiknode.pro/1581092744fa8ee03fd0cb1d157f3b907e9840e4/';

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let umi = null;
    let currentGenesis = null;
    let currentBaseMint = null;
    let candleSeries = null;

    // UI Elements
    const loginBtn = document.getElementById('login-btn');
    const appContent = document.getElementById('app-content');
    const statusDiv = document.getElementById('status');
    const launchesList = document.getElementById('launches-list');
    
    // Estado activo
    const activeImg = document.getElementById('active-token-img');
    const activeName = document.getElementById('active-token-name');
    const activeSymbol = document.getElementById('active-token-symbol');
    const activePrice = document.getElementById('active-token-price');
    const activeMcap = document.getElementById('active-token-mcap');

    function showStatus(msg, type) {
      statusDiv.textContent = msg;
      statusDiv.className = type;
      setTimeout(() => { statusDiv.className = ''; statusDiv.style.display = 'none'; }, 5000);
    }

    // 1. CONEXIÓN
    loginBtn.addEventListener('click', async () => {
      const provider = window.phantom?.solana || window.solana;
      if (!provider || !provider.isPhantom) return showStatus('Instala Phantom Wallet.', 'error');
      
      try {
        await provider.connect();
        const { data, error } = await supabase.auth.signInWithWeb3({
          chain: 'solana', statement: 'I accept the Terms.', wallet: provider 
        });
        if (error) throw error;

        loginBtn.classList.add('hidden');
        appContent.classList.remove('hidden');

        umi = createUmi(FRONTEND_RPC);
        umi.use(walletAdapterIdentity(provider));
        umi.use(mplToolbox());
        
        const { genesis } = await import('https://cdn.jsdelivr.net/npm/@metaplex-foundation/genesis@0.43.4/+esm');
        umi.use(genesis());
        
        await loadSavedLaunches();
        showStatus('✅ Conectado.', 'success');
      } catch (err) {
        console.error(err);
        showStatus('Error: ' + err.message, 'error');
      }
    });

    // 2. CARGAR LANZAMIENTOS
    async function loadSavedLaunches() {
      const { data, error } = await supabase.from('launches').select('*').order('created_at', { ascending: false });
      if (error) return console.error(error);
      
      launchesList.innerHTML = '';
      if(data.length === 0) {
        launchesList.innerHTML = '<p style="color:#888; font-size:0.9rem;">No hay tokens creados aún.</p>';
        return;
      }

      data.forEach(launch => {
        const div = document.createElement('div');
        div.className = 'launch-item';
        div.innerHTML = `
          <div style="display:flex; align-items:center; gap:10px;">
            <img src="${launch.token_image_url}" style="width:30px;height:30px;border-radius:50%;">
            <div>
              <strong style="display:block; font-size:0.9rem;">${launch.token_name}</strong>
              <small style="color:#888;">${launch.token_symbol}</small>
            </div>
          </div>
          <span style="color:var(--solana-green); font-size: 0.8rem;">Seleccionar</span>
        `;
        div.addEventListener('click', () => selectLaunch(launch, div));
        launchesList.appendChild(div);
      });
    }

    // 3. SELECCIONAR TOKEN
    async function selectLaunch(launch, element) {
      document.querySelectorAll('.launch-item').forEach(el => el.classList.remove('active'));
      if(element) element.classList.add('active');

      currentGenesis = launch.genesis_address;
      currentBaseMint = launch.base_mint;

      activeName.textContent = launch.token_name;
      activeSymbol.textContent = launch.token_symbol;
      activeImg.src = launch.token_image_url;

      await updateTokenStats(currentGenesis, launch.token_name, launch.token_symbol, launch.token_image_url);
      updateChart(currentGenesis);
    }

    // 4. CREAR TOKEN (Con Auto-Retry)
    document.getElementById('create-launch-btn').addEventListener('click', async () => {
      if (!umi) return showStatus('Conecta wallet primero.', 'error');
      const fileInput = document.getElementById('logo-input');
      if (!fileInput.files.length) return showStatus('Selecciona un logo.', 'error');

      const btn = document.getElementById('create-launch-btn');
      btn.disabled = true;
      btn.textContent = 'Creando...';

      try {
        const file = fileInput.files[0];
        const reader = new FileReader();
        const fileBase64 = await new Promise((res, rej) => {
          reader.onload = (e) => res(e.target.result.split(',')[1]);
          reader.onerror = rej;
          reader.readAsDataURL(file);
        });

        showStatus('Subiendo logo...', 'info');
        const { data: uploadData, error: uploadError } = await supabase.functions.invoke('upload-to-irys', {
          body: { fileBase64, fileName: file.name, fileType: file.type }
        });
        if (uploadError) throw new Error(uploadError.message);
        if (uploadData?.error) throw new Error(uploadData.error);
        
        const imageUrl = uploadData.url;
        const tokenName = document.getElementById('token-name').value;
        const tokenSymbol = document.getElementById('token-symbol').value;

        showStatus('Preparando transacciones...', 'info');

        const { createAndRegisterLaunch } = await import('https://cdn.jsdelivr.net/npm/@metaplex-foundation/genesis@0.43.4/+esm');

        const launchInput = {
          wallet: umi.identity.publicKey,
          network: 'solana-devnet',
          token: { name: tokenName, symbol: tokenSymbol, image: imageUrl },
          launchType: 'bondingCurve',
          launch: { firstBuyAmount: 0.1 },
        };

        const batchTxSender = async (transactions) => {
          showStatus('👉 Aprueba en Phantom', 'info');
          const signedTxs = await umi.identity.signAllTransactions(transactions);
          const signatures = await Promise.all(signedTxs.map(tx => 
            umi.rpc.sendTransaction(tx, { skipPreflight: true, preflightCommitment: 'processed' })
          ));
          const lastIdx = signedTxs.length - 1;
          await umi.rpc.confirmTransaction({
            signature: signatures[lastIdx],
            blockhash: signedTxs[lastIdx].message.recentBlockhash,
            lastValidBlockHeight: signedTxs[lastIdx].message.lastValidBlockHeight,
          }, { commitment: 'confirmed' });
          return signatures;
        };

        let result;
        let maxRetries = 3;
        
        // AUTO-RETRY INVISIBLE
        for (let attempt = 1; attempt <= maxRetries; attempt++) {
          try {
            result = await createAndRegisterLaunch(umi, { txSender: batchTxSender }, launchInput);
            break; 
          } catch (err) {
            if (err.message?.includes('Blockhash') && attempt < maxRetries) {
              showStatus(`Red lenta, reintentando (${attempt}/${maxRetries})...`, 'info');
              await new Promise(r => setTimeout(r, 2000));
            } else {
              throw err;
            }
          }
        }
        
        const genesisAddress = result.genesisAccount.toString();
        const baseMint = result.mintAddress.toString();

        await supabase.from('launches').insert({
          authority: MI_DIRECCION_ORB, token_name: tokenName, token_symbol: tokenSymbol,
          token_image_url: imageUrl, genesis_address: genesisAddress, base_mint: baseMint,
        });

        showStatus('🚀 ¡Token creado!', 'success');
        await loadSavedLaunches();
        
        // Auto-seleccionar el token recién creado
        setTimeout(() => {
          const firstItem = document.querySelector('.launch-item');
          if(firstItem) firstItem.click();
        }, 1000);

      } catch (err) {
        console.error(err);
        showStatus('Error: ' + (err.message || 'Revisa la consola.'), 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Crear Lanzamiento (0.1 SOL)';
      }
    });

    // 5. ACTUALIZAR STATS
    async function updateTokenStats(genesisAddress, name, symbol, image) {
      try {
        const { findBondingCurveBucketV2Pda, fetchBondingCurveBucketV2 } = await import('https://cdn.jsdelivr.net/npm/@metaplex-foundation/genesis@0.43.4/+esm');
        const [bucketPda] = findBondingCurveBucketV2Pda(umi, { genesisAccount: publicKey(genesisAddress), bucketIndex: 0 });
        const bucket = await fetchBondingCurveBucketV2(umi, bucketPda);
        
        if (bucket) {
          const totalSol = (Number(bucket.virtualSol) + Number(bucket.realSol)) / 1e9;
          const totalTokens = (Number(bucket.virtualTokens) + Number(bucket.realTokens)) / 1e9;
          if (totalTokens > 0) {
            const price = totalSol / totalTokens;
            const marketCap = price * 1_000_000_000;
            activePrice.textContent = price.toFixed(8) + ' SOL';
            activeMcap.textContent = '$' + marketCap.toLocaleString('en-US', { maximumFractionDigits: 0 });
          }
        }
      } catch (e) { console.error(e); }
    }

    // 6. GRÁFICO
    function initChart() {
      const container = document.getElementById('chart-container');
      if (!container || candleSeries) return;
      const chart = LightweightCharts.createChart(container, {
        width: container.clientWidth, height: container.clientHeight,
        layout: { background: { color: 'transparent' }, textColor: '#DDD' },
        grid: { vertLines: { color: '#333' }, horzLines: { color: '#333' } },
      });
      candleSeries = chart.addCandlestickSeries({
        upColor: '#14F195', downColor: '#ff4d4d', borderVisible: false,
        wickUpColor: '#14F195', wickDownColor: '#ff4d4d',
      });
    }

    async function updateChart(genesisAddress) {
      if (!candleSeries) initChart();
      if (!candleSeries) return;
      
      const { data, error } = await supabase.from('bond_swaps').select('block_time, price').eq('genesis_address', genesisAddress).order('block_time', { ascending: true });
      if (error || !data) return;

      const candles = new Map();
      for (const swap of data) {
        const bucket = Math.floor(swap.block_time / 3600) * 3600;
        if (!candles.has(bucket)) {
          candles.set(bucket, { time: bucket, open: swap.price, high: swap.price, low: swap.price, close: swap.price });
        } else {
          const c = candles.get(bucket);
          c.high = Math.max(c.high, swap.price); c.low = Math.min(c.low, swap.price); c.close = swap.price;
        }
      }
      candleSeries.setData(Array.from(candles.values()));
    }

    // 7. COMPRAR
    document.getElementById('buy-btn').addEventListener('click', async () => {
      if (!umi || !currentGenesis) return showStatus('Selecciona un token primero.', 'error');
      const amountSol = parseFloat(document.getElementById('trade-amount').value);
      const slippageBps = parseFloat(document.getElementById('slippage').value) * 100;

      try {
        showStatus('Comprando...', 'info');
        const { swapBondingCurveV2, getSwapResult, applySlippage, isSwappable, findBondingCurveBucketV2Pda, fetchBondingCurveBucketV2, SwapDirection } = await import('https://cdn.jsdelivr.net/npm/@metaplex-foundation/genesis@0.43.4/+esm');
        
        const genesisPubkey = publicKey(currentGenesis);
        const baseMint = publicKey(currentBaseMint);
        const quoteMint = publicKey('So11111111111111111111111111111111111111112');
        
        const [bucketPda] = findBondingCurveBucketV2Pda(umi, { genesisAccount: genesisPubkey, bucketIndex: 0 });
        const bucket = await fetchBondingCurveBucketV2(umi, bucketPda);
        if (!isSwappable(bucket)) throw new Error("Curva inactiva.");

        const amountIn = BigInt(Math.floor(amountSol * 1_000_000_000));
        const quote = getSwapResult(bucket, amountIn, SwapDirection.Buy);
        const minAmountOut = applySlippage(quote.amountOut, slippageBps);

        const SPL_TOKEN = publicKey('TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA');
        const [userQuoteTokenAccount] = findAssociatedTokenPda(umi, { mint: quoteMint, owner: umi.identity.publicKey });
        const [userBaseTokenAccount] = findAssociatedTokenPda(umi, { mint: baseMint, owner: umi.identity.publicKey });

        await transactionBuilder()
          .add(createTokenIfMissing(umi, { mint: quoteMint, token: userQuoteTokenAccount, tokenProgram: SPL_TOKEN }))
          .add(transferSol(umi, { destination: userQuoteTokenAccount, amount: sol(amountSol) }))
          .add(syncNative(umi, { account: userQuoteTokenAccount }))
          .sendAndConfirm(umi);

        await swapBondingCurveV2(umi, {
          genesisAccount: genesisPubkey, bucket: bucketPda, baseMint, quoteMint,
          baseTokenAccount: userBaseTokenAccount, quoteTokenAccount: userQuoteTokenAccount,
          amount: quote.amountIn, minAmountOutScaled: minAmountOut, swapDirection: SwapDirection.Buy,
        }).sendAndConfirm(umi);

        showStatus('✅ Compra exitosa', 'success');
        
        const price = amountSol / (Number(quote.amountOut) / 1e9);
        await supabase.from('bond_swaps').insert({ genesis_address: currentGenesis, block_time: Math.floor(Date.now()/1000), quote_amount: Number(quote.amountIn), base_amount: Number(quote.amountOut), price, swap_direction: 'buy' });
        
        updateTokenStats(currentGenesis);
        updateChart(currentGenesis);
        try { await closeToken(umi, { account: userQuoteTokenAccount, destination: umi.identity.publicKey, owner: umi.identity }).sendAndConfirm(umi); } catch (e) {}

      } catch (err) {
        showStatus('Error: ' + err.message, 'error');
      }
    });

    // 8. VENDER
    document.getElementById('sell-btn').addEventListener('click', async () => {
      if (!umi || !currentGenesis) return showStatus('Selecciona un token.', 'error');
      const amountTokens = parseFloat(document.getElementById('trade-amount').value);
      const slippageBps = parseFloat(document.getElementById('slippage').value) * 100;

      try {
        showStatus('Vendiendo...', 'info');
        const { swapBondingCurveV2, getSwapResult, applySlippage, isSwappable, findBondingCurveBucketV2Pda, fetchBondingCurveBucketV2, SwapDirection } = await import('https://cdn.jsdelivr.net/npm/@metaplex-foundation/genesis@0.43.4/+esm');
        
        const genesisPubkey = publicKey(currentGenesis);
        const baseMint = publicKey(currentBaseMint);
        const quoteMint = publicKey('So11111111111111111111111111111111111111112');

        const [bucketPda] = findBondingCurveBucketV2Pda(umi, { genesisAccount: genesisPubkey, bucketIndex: 0 });
        const bucket = await fetchBondingCurveBucketV2(umi, bucketPda);
        if (!isSwappable(bucket)) throw new Error("Curva inactiva.");

        const amountIn = BigInt(Math.floor(amountTokens * 1_000_000_000));
        const quote = getSwapResult(bucket, amountIn, SwapDirection.Sell);
        const minAmountOut = applySlippage(quote.amountOut, slippageBps);

        const [userQuoteTokenAccount] = findAssociatedTokenPda(umi, { mint: quoteMint, owner: umi.identity.publicKey });
        const [userBaseTokenAccount] = findAssociatedTokenPda(umi, { mint: baseMint, owner: umi.identity.publicKey });

        await swapBondingCurveV2(umi, {
          genesisAccount: genesisPubkey, bucket: bucketPda, baseMint, quoteMint,
          baseTokenAccount: userBaseTokenAccount, quoteTokenAccount: userQuoteTokenAccount,
          amount: quote.amountIn, minAmountOutScaled: minAmountOut, swapDirection: SwapDirection.Sell,
        }).sendAndConfirm(umi);

        showStatus('✅ Venta exitosa', 'success');

        const price = (Number(quote.amountOut) / 1e9) / amountTokens;
        await supabase.from('bond_swaps').insert({ genesis_address: currentGenesis, block_time: Math.floor(Date.now()/1000), quote_amount: Number(quote.amountIn), base_amount: Number(quote.amountOut), price, swap_direction: 'sell' });
        
        updateTokenStats(currentGenesis);
        updateChart(currentGenesis);
        try { await closeToken(umi, { account: userQuoteTokenAccount, destination: umi.identity.publicKey, owner: umi.identity }).sendAndConfirm(umi); } catch (e) {}

      } catch (err) {
        showStatus('Error: ' + err.message, 'error');
      }
    });

  </script>
