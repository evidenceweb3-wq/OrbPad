<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Launchpad Pump.fun - Cosmic Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --sol-purple: #9945FF;
            --sol-green: #14F195;
            --ui: #e9ecff;
            --mut: #8b91b8;
            --c: #ffb347;
            --red: #ef4444;
            --font-mono: 'Share Tech Mono', ui-monospace, monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: system-ui, -apple-system, sans-serif; 
            background: radial-gradient(120% 90% at 50% 40%, #10122b 0%, #070815 55%, #03040a 100%);
            color: var(--ui); 
            height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            overflow: hidden; 
        }

        #space-bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; }

        .app-container { 
            display: grid; 
            grid-template-columns: 360px 1fr; 
            gap: 16px; 
            width: 100%; 
            max-width: 1250px; 
            height: 98vh; 
            max-height: 900px; 
            z-index: 1;
        }
        
        .panel { 
            background: linear-gradient(180deg, rgba(14,17,38,.75), rgba(9,11,24,.85));
            backdrop-filter: blur(20px) saturate(150%);
            -webkit-backdrop-filter: blur(20px) saturate(150%);
            border: 1px solid rgba(255,255,255,.08); 
            border-radius: 20px; 
            padding: 16px; 
            display: flex; 
            flex-direction: column; 
            box-shadow: 0 20px 50px rgba(0,0,0,.5), inset 0 0 0 1px rgba(255,255,255,.02); 
            overflow: hidden; 
        }
        
        .panel-scroll { overflow-y: auto; flex: 1; padding-right: 4px; }
        .panel-scroll::-webkit-scrollbar { width: 4px; }
        .panel-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,.1); border-radius: 4px; }
        
        h1 { font-size: 1.4rem; color: #fff; letter-spacing: 2px; text-transform: uppercase; display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
        h1 span { background: linear-gradient(135deg, #fff 0%, #ffd27a 50%, #ffb347 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        h2 { font-size: 0.85rem; color: var(--mut); text-transform: uppercase; letter-spacing: 1px; margin-top: 10px; margin-bottom: 8px; font-weight: 600; }
        
        button { 
            background: linear-gradient(135deg, var(--sol-purple), #7a35d6); 
            color: white; border: none; padding: 12px 14px; border-radius: 10px; 
            cursor: pointer; font-weight: bold; transition: all 0.2s; font-size: 0.9rem; 
            box-shadow: 0 4px 15px rgba(153, 69, 255, 0.3); 
        }
        button:hover:not(:disabled) { filter: brightness(1.1); transform: translateY(-1px); box-shadow: 0 6px 20px rgba(153, 69, 255, 0.5); }
        button:disabled { background: #333; color: #777; cursor: not-allowed; box-shadow: none; }
        
        input[type="text"], input[type="number"] { 
            padding: 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,.1); 
            background: rgba(0,0,0,.3); color: #fff; margin-bottom: 8px; 
            width: 100%; font-size: 0.9rem; outline: none; transition: border 0.2s; 
        }
        input:focus { border-color: var(--sol-purple); background: rgba(0,0,0,.5); }
        
        .status { font-size: 0.75rem; color: var(--sol-green); margin-top: 4px; word-break: break-all; white-space: pre-wrap; line-height: 1.3; text-shadow: 0 0 8px rgba(20, 241, 149, 0.3); }
        .error { color: var(--red) !important; text-shadow: 0 0 8px rgba(239, 68, 68, 0.3); }
        
        .wallet-box { 
            display: flex; justify-content: space-between; align-items: center; 
            background: rgba(0,0,0,.3); padding: 10px 12px; border-radius: 10px; 
            border: 1px solid rgba(255,255,255,.08); margin-bottom: 12px; 
        }
        .wallet-balance { font-family: var(--font-mono); font-size: 1.1rem; color: var(--sol-green); font-weight: bold; text-shadow: 0 0 10px rgba(20,241,149,.4); }
        
        /* Custom File Upload */
        .custom-file-upload {
            display: flex; align-items: center; justify-content: center; gap: 10px;
            background: rgba(0,0,0,.3); border: 1px dashed rgba(255,255,255,.2);
            border-radius: 8px; padding: 14px; cursor: pointer; margin-bottom: 8px;
            transition: all 0.2s; color: var(--mut); font-size: 0.85rem;
        }
        .custom-file-upload:hover { border-color: var(--sol-purple); background: rgba(153, 69, 255, 0.05); color: var(--ui); }
        .custom-file-upload input[type="file"] { display: none; }

        /* PLANET TOKEN CARD */
        .planet-header {
            display: flex; align-items: center; gap: 20px;
            background: rgba(0,0,0,.4); border: 1px solid rgba(255,255,255,.1);
            padding: 20px; border-radius: 16px; margin-bottom: 16px;
            position: relative; overflow: hidden;
        }
        
        .planet-container {
            position: relative; width: 100px; height: 100px;
            display: flex; justify-content: center; align-items: center; flex-shrink: 0;
        }
        
        .planet-img {
            width: 75px; height: 75px; border-radius: 50%; object-fit: cover; z-index: 2;
            border: 3px solid rgba(255,255,255,.2);
            box-shadow: 0 0 20px rgba(20, 241, 149, 0.5), inset 0 0 15px rgba(0,0,0,.8);
            animation: float 6s ease-in-out infinite; background: #111;
        }
        
        .planet-ring {
            position: absolute; width: 110px; height: 35px;
            border: 2px solid rgba(153, 69, 255, 0.5); border-radius: 50%;
            transform: rotate(-20deg); z-index: 1; animation: spinRing 12s linear infinite;
            box-shadow: 0 0 15px rgba(153, 69, 255, 0.3);
        }
        
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
        @keyframes spinRing { 0% { transform: rotate(-20deg); } 100% { transform: rotate(340deg); } }
        
        .planet-info { flex: 1; overflow: hidden; z-index: 2; display: flex; justify-content: space-between; align-items: center; }
        .planet-text { overflow: hidden; }
        .planet-name { font-weight: 800; font-size: 1.6rem; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.1; }
        .planet-symbol { color: var(--sol-green); font-size: 0.9rem; font-family: var(--font-mono); letter-spacing: 1px; display: flex; align-items: center; gap: 8px; }
        
        /* LIVE PRICE DISPLAY */
        .live-price-box {
            background: rgba(20, 241, 149, 0.1); border: 1px solid rgba(20, 241, 149, 0.3);
            padding: 4px 10px; border-radius: 6px; font-size: 1.1rem; font-weight: bold;
            color: var(--sol-green); font-family: var(--font-mono); text-shadow: 0 0 10px rgba(20, 241, 149, 0.5);
        }

        /* PRICE CHANGE BADGE */
        .price-change {
            font-size: 0.85rem; font-weight: bold; padding: 4px 8px; border-radius: 6px;
            font-family: var(--font-mono); margin-left: auto;
        }
        .price-change.up { background: rgba(20, 241, 149, 0.15); color: var(--sol-green); border: 1px solid rgba(20, 241, 149, 0.3); }
        .price-change.down { background: rgba(239, 68, 68, 0.15); color: var(--red); border: 1px solid rgba(239, 68, 68, 0.3); }

        .metrics-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 16px; }
        .metric-box { 
            background: rgba(0,0,0,.3); border: 1px solid rgba(255,255,255,.05); 
            padding: 10px; border-radius: 12px; text-align: center; 
        }
        .metric-box span { display: block; font-size: 0.65rem; color: var(--mut); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
        .metric-box strong { font-family: var(--font-mono); font-size: 1.05rem; color: var(--c); text-shadow: 0 0 10px rgba(255, 179, 71, 0.4); }
        .metric-box.real strong { color: var(--sol-green); text-shadow: 0 0 10px rgba(20, 241, 149, 0.4); }
        
        /* TABS & CHART */
        .chart-tabs { display: flex; gap: 8px; margin-bottom: 8px; position: relative; z-index: 10; }
        .chart-tab {
            background: transparent; border: none; color: var(--mut); padding: 6px 12px;
            font-size: 0.8rem; cursor: pointer; border-radius: 6px; font-weight: bold;
            box-shadow: none; transition: 0.2s;
        }
        .chart-tab:hover { background: rgba(255,255,255,0.05); color: #fff; transform: none; box-shadow: none; }
        .chart-tab.active { background: rgba(153, 69, 255, 0.2); color: var(--sol-purple); border: 1px solid rgba(153, 69, 255, 0.3); }

        .content-wrapper { 
            flex: 1; min-height: 200px; width: 100%; position: relative; 
            background: rgba(0,0,0,.2); border-radius: 12px; 
            border: 1px solid rgba(255,255,255,.05); overflow: hidden; margin-bottom: 16px; 
        }
        .chart-container { width: 100%; height: 100%; position: absolute; inset: 0; }
        
        /* TRADES LIST */
        .trades-container {
            position: absolute; inset: 0; overflow-y: auto; display: none; flex-direction: column;
            background: rgba(0,0,0,0.4); z-index: 5;
        }
        .trade-row {
            display: flex; justify-content: space-between; padding: 10px 12px;
            border-bottom: 1px solid rgba(255,255,255,0.05); font-family: var(--font-mono); font-size: 0.85rem;
        }
        .trade-row:hover { background: rgba(255,255,255,0.02); }
        .trade-type { font-weight: bold; }
        .trade-type.buy { color: var(--sol-green); }
        .trade-type.sell { color: var(--red); }
        
        .trade-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .trade-col { display: flex; flex-direction: column; }
        
        .trade-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 8px; min-height: 24px; }
        
        .quick-buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 8px; }
        .quick-buttons button { background: rgba(255,255,255,.05); color: var(--ui); font-size: 0.8rem; padding: 8px; border: 1px solid rgba(255,255,255,.1); box-shadow: none; border-radius: 8px; }
        .quick-buttons button:hover { background: rgba(255,255,255,.15); color: #fff; border-color: var(--c); }
        
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(20, 241, 149, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(20, 241, 149, 0); } 100% { box-shadow: 0 0 0 0 rgba(20, 241, 149, 0); } }
        .graduated-badge { font-size:0.75rem; background:var(--sol-green); color:#000; padding:4px 10px; border-radius:20px; font-weight:bold; animation: pulse 2s infinite; position: absolute; top: 15px; right: 15px; }
        
        .my-tokens-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 8px; }
        .my-token-item { 
            background: rgba(0,0,0,.4); border: 1px solid rgba(255,255,255,.08); 
            border-radius: 8px; padding: 8px; display: flex; flex-direction: column; 
            align-items: center; cursor: pointer; transition: 0.2s; position: relative;
        }
        .my-token-item:hover { border-color: var(--sol-green); background: rgba(20, 241, 149, 0.05); }
        .my-token-item img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; margin-bottom: 6px; background: #222; }
        .my-token-symbol { font-weight: bold; color: #fff; font-size: 0.8rem; margin-bottom: 2px; }
        .my-token-mint { font-size: 0.6rem; color: var(--mut); font-family: var(--font-mono); }
        
        .quote-text { font-size: 0.8rem; color: var(--mut); margin-bottom: 8px; min-height: 18px; }
        .quote-text span { color: var(--sol-green); font-weight: bold; font-family: var(--font-mono); }
        
        .balance-text { font-size: 0.8rem; color: var(--mut); font-family: var(--font-mono); }
        .balance-text span { color: var(--sol-green); font-weight: bold; }

        .a { color: var(--sol-purple); text-decoration: none; font-weight: bold; }
        .a:hover { text-decoration: underline; }
    </style>
    <script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>

    <canvas id="space-bg"></canvas>

    <div class="app-container">
        <!-- LEFT PANEL: CREATE & SELECT -->
        <div class="panel">
            <h1><span>🚀 Launchpad</span></h1>
            
            <div class="wallet-box">
                <div>
                    <div style="font-size: 0.65rem; color: var(--mut);">WALLET SOL</div>
                    <div id="walletBalance" class="wallet-balance">0.00 SOL</div>
                </div>
                <button id="connectBtn" style="width:auto; margin:0; padding: 8px 12px; font-size: 0.75rem;">Connect</button>
            </div>
            <p id="walletStatus" class="status" style="margin-top:0; margin-bottom:12px; font-size: 0.65rem;">Not connected</p>

            <div class="panel-scroll">
                <h2>Create Token</h2>
                <input id="tokenName" type="text" placeholder="Token Name" />
                <input id="tokenSymbol" type="text" placeholder="Symbol (e.g. MTK)" />
                
                <!-- CUSTOM FILE UPLOAD UI -->
                <label class="custom-file-upload" id="fileUploadLabel">
                    <input type="file" id="tokenImage" accept="image/*" />
                    <span id="fileUploadText">📷 Click to upload image</span>
                </label>

                <button id="createTokenBtn" disabled style="width:100%;">Create + Initial Buy (0.01 SOL)</button>
                <p id="createStatus" class="status"></p>

                <h2 style="margin-top: 15px;">My Created Tokens</h2>
                <div id="savedTokensList" class="my-tokens-grid" style="display: none;"></div>
            </div>
        </div>

        <!-- RIGHT PANEL: ACTIVE TOKEN -->
        <div class="panel">
            <h2>Active Token</h2>
            <div style="display:flex; gap:8px; margin-bottom: 16px;">
                <input id="mintAddressInput" type="text" placeholder="Mint Address" style="margin-bottom:0;" />
                <button id="loadTokenBtn" style="width:auto;">Load</button>
            </div>

            <div id="tokenDisplay" style="display:none; flex: 1; flex-direction: column; min-height: 0;">
                
                <!-- HERO PLANET SECTION -->
                <div class="planet-header">
                    <div id="graduatedBadge" class="graduated-badge" style="display:none;">GRADUATED</div>
                    <div class="planet-container">
                        <div class="planet-ring"></div>
                        <img id="tokenImagePreview" class="planet-img" src="https://placehold.co/100x100/1f1f28/14F195?text=Coin" alt="Token" />
                    </div>
                    <div class="planet-info">
                        <div class="planet-text">
                            <div class="planet-name" id="displayName">—</div>
                            <div class="planet-symbol">
                                <span id="displaySymbol">—</span>
                                <div class="live-price-box"><span id="price">—</span></div>
                            </div>
                        </div>
                        <div id="priceChange" class="price-change up">+0.00%</div>
                    </div>
                </div>

                <!-- METRICS -->
                <div class="metrics-row">
                    <div class="metric-box"><span>Virtual MCap (SOL)</span><strong id="mcapSol">—</strong></div>
                    <div class="metric-box"><span>Virtual MCap (USD)</span><strong id="mcapUsd">—</strong></div>
                    <div class="metric-box real"><span>Real SOL</span><strong id="realSol">—</strong></div>
                </div>
                
                <!-- TABS & CONTENT -->
                <div class="chart-tabs">
                    <button class="chart-tab active" id="tabChart" onclick="switchTab('chart')">📈 Chart</button>
                    <button class="chart-tab" id="tabTrades" onclick="switchTab('trades')">🧾 Trades</button>
                </div>
                
                <div class="content-wrapper">
                    <div id="chartContainer" class="chart-container"></div>
                    <div id="tradesContainer" class="trades-container">
                        <div id="tradesList" style="padding: 10px; text-align: center; color: var(--mut);">Loading trades...</div>
                    </div>
                </div>

                <!-- TRADE SECTION -->
                <div id="tradeSection" style="display:none;">
                    <div class="trade-grid">
                        <!-- BUY -->
                        <div class="trade-col">
                            <div class="trade-header">
                                <h2 style="color: var(--sol-green); margin: 0;">Buy</h2>
                            </div>
                            <div class="quick-buttons">
                                <button onclick="setSolAmount(0.01)">0.01</button>
                                <button onclick="setSolAmount(0.05)">0.05</button>
                                <button onclick="setSolAmount(0.1)">0.1</button>
                                <button onclick="setSolAmount(0.5)">0.5</button>
                            </div>
                            <input id="solAmount" type="text" placeholder="SOL to spend" oninput="updateBuyQuote()" />
                            <p class="quote-text" id="buyQuote">You will receive: <span>—</span></p>
                            <button id="buyBtn" disabled style="width:100%;">Buy</button>
                        </div>
                        
                        <!-- SELL -->
                        <div class="trade-col">
                            <div class="trade-header">
                                <h2 style="color: var(--red); margin: 0;">Sell</h2>
                                <div class="balance-text">Balance: <span id="userTokenBalanceDisplay">0.00</span></div>
                            </div>
                            <div class="quick-buttons">
                                <button onclick="setSellPercent(0.25)">25%</button>
                                <button onclick="setSellPercent(0.50)">50%</button>
                                <button onclick="setSellPercent(0.75)">75%</button>
                                <button onclick="setSellPercent(1.00)">100%</button>
                            </div>
                            <input id="tokenAmountToSell" type="text" placeholder="Amount of Tokens" oninput="updateSellQuote()" />
                            <p class="quote-text" id="sellQuote">You will receive: <span>—</span></p>
                            <button id="sellBtn" disabled style="width:100%; background: linear-gradient(135deg, #ef4444, #b91c1c); box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3);">Sell</button>
                        </div>
                    </div>
                    <p id="tradeStatus" class="status" style="text-align: center;"></p>
                </div>
            </div>
        </div>
    </div>

        // BACKGROUND

        async function withTimeout(promise, timeoutMs = 15000) {
            return Promise.race([promise, new Promise((_, reject) => setTimeout(() => reject(new Error('Network timeout. Try again.')), timeoutMs))]);

        function initChartIfNeeded() {
            if (chartInitialized) return;
            const container = document.getElementById('chartContainer');
            if (container.clientWidth === 0 || container.clientHeight === 0) return;
            try {
                chart = LightweightCharts.createChart(container, {
                    layout: { background: { type: 'solid', color: 'transparent' }, textColor: '#8b91b8' },
                    grid: { vertLines: { color: 'rgba(255,255,255,0.03)' }, horzLines: { color: 'rgba(255,255,255,0.03)' } },
                    rightPriceScale: { borderColor: 'rgba(255,255,255,0.1)' },
                    timeScale: { borderColor: 'rgba(255,255,255,0.1)', timeVisible: true, secondsVisible: true },
                    crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
                    localization: {
                        priceFormatter: (price) => `${price.toFixed(2)} SOL`,
                        timeFormatter: (time) => new Date(time * 1000).toLocaleTimeString(),
                    }
                });
                areaSeries = chart.addAreaSeries({ 
                    lineColor: '#14F195', 
                    topColor: 'rgba(20, 241, 149, 0.4)', 
                    bottomColor: 'rgba(20, 241, 149, 0.0)', 
                    lineWidth: 2 
                });
                const resizeObserver = new ResizeObserver(entries => {
                    if (entries.length === 0 || entries[0].target !== container) return;
                    const newRect = entries[0].contentRect;
                    chart.applyOptions({ width: newRect.width, height: newRect.height });
                });
                resizeObserver.observe(container);
                chartInitialized = true;

        const CHART_KEY_PREFIX = 'pump_chart_mcap_'; // Changed to store mcap
        const TRADES_KEY_PREFIX = 'pump_trades_';

        function saveChartPoint(mintStr, mcapSol) {
            try {
                const key = CHART_KEY_PREFIX + mintStr;
                let history = JSON.parse(localStorage.getItem(key) || '[]');
                const now = Math.floor(Date.now() / 1000);
                
                if (history.length > 0 && history[history.length - 1].time >= now) {
                    history[history.length - 1].value = mcapSol;
                } else {
                    history.push({ time: now, value: mcapSol });
                }

                if (history.length > 500) history = history.slice(history.length - 500);
                localStorage.setItem(key, JSON.stringify(history));
                
                if (areaSeries) areaSeries.setData(history);
            } catch (e) { console.warn('Chart save error:', e); }
        }

        function saveTrade(mintStr, type, solAmount, tokenAmount) {
            try {
                const key = TRADES_KEY_PREFIX + mintStr;
                let trades = JSON.parse(localStorage.getItem(key) || '[]');
                trades.unshift({
                    type,
                    solAmount: parseFloat(solAmount),
                    tokenAmount: parseFloat(tokenAmount),
                    time: Date.now()
                });
                localStorage.setItem(key, JSON.stringify(trades.slice(0, 50)));
            } catch (e) { console.warn('Trade save error:', e); }
        }

        async function uploadToPinata(file, name, symbol) {
            const imgForm = new FormData(); imgForm.append('file', file);
            const imgRes = await fetch('https://api.pinata.cloud/pinning/pinFileToIPFS', { method: 'POST', headers: { Authorization: `Bearer ${PINATA_JWT}` }, body: imgForm });
            if (!imgRes.ok) throw new Error('Pinata image error');
            const imageUri = `https://gateway.pinata.cloud/ipfs/${(await imgRes.json()).IpfsHash}`;

            const metadata = { name, symbol, image: imageUri, description: '' };
            const metaForm = new FormData();
            metaForm.append('file', new Blob([JSON.stringify(metadata)], { type: 'application/json' }), 'metadata.json');
            const metaRes = await fetch('https://api.pinata.cloud/pinning/pinFileToIPFS', { method: 'POST', headers: { Authorization: `Bearer ${PINATA_JWT}` }, body: metaForm });
            if (!metaRes.ok) throw new Error('Pinata metadata error');
            return `https://gateway.pinata.cloud/ipfs/${(await metaRes.json()).IpfsHash}`;
        }

        async function loadTokenData(mintStr) {
            if (!mintStr) return;
            try {
                currentMint = new PublicKey(mintStr);
                currentBondingCurve = await withTimeout(onlineSdk.fetchBondingCurve(currentMint));
                cachedGlobal = await withTimeout(onlineSdk.fetchGlobal());
                cachedFeeConfig = await withTimeout(onlineSdk.fetchFeeConfig());
                
                const vSol = currentBondingCurve.virtualQuoteReserves ? currentBondingCurve.virtualQuoteReserves : currentBondingCurve.virtualSolReserves;
                const vToken = currentBondingCurve.virtualTokenReserves;
                const rSol = currentBondingCurve.realQuoteReserves ? currentBondingCurve.realQuoteReserves : currentBondingCurve.realSolReserves;
                
                if (!vSol || !vToken || !rSol) throw new Error('Curve not recognized.');

                const mcapLamports = vSol.mul(currentBondingCurve.tokenTotalSupply).div(vToken);
                const mcapSol = mcapLamports.toNumber() / LAMPORTS_PER_SOL;
                const mcapUsd = mcapSol * currentSolPriceUsd;
                const realSol = rSol.toNumber() / LAMPORTS_PER_SOL;
                
                const GRADUATION_TARGET = 69;
                const progressPct = Math.min((realSol / GRADUATION_TARGET) * 100, 100); 
                
                const priceSol = (vSol.toNumber() / 1e9) / (vToken.toNumber() / 1e6);
                let priceStr = priceSol.toFixed(9).replace(/0+$/, '').replace(/\.$/, ''); 
                if (priceStr === '0' || priceStr === '') priceStr = priceSol.toExponential(4);

                userTokenBalance = await fetchUserTokenBalance();
                document.getElementById('userTokenBalanceDisplay').textContent = userTokenBalance.toLocaleString('en-US', { maximumFractionDigits: 2 });

                document.getElementById('mcapSol').textContent = `${mcapSol.toFixed(2)} SOL`;
                document.getElementById('mcapUsd').textContent = `$${mcapUsd.toFixed(2)}`;
                document.getElementById('realSol').textContent = `${realSol.toFixed(2)} SOL`;
                document.getElementById('price').textContent = `${priceStr} SOL`;
                
                // Price Change Calculation (from chart data)
                const history = JSON.parse(localStorage.getItem(CHART_KEY_PREFIX + mintStr) || '[]');
                let changePct = 0;
                if (history.length > 1) {
                    const firstMcap = history[0].value;
                    const lastMcap = history[history.length - 1].value;
                    if (firstMcap > 0) changePct = ((lastMcap - firstMcap) / firstMcap) * 100;
                }
                
                const changeEl = document.getElementById('priceChange');
                changeEl.textContent = `${changePct >= 0 ? '+' : ''}${changePct.toFixed(2)}%`;
                changeEl.className = `price-change ${changePct >= 0 ? 'up' : 'down'}`;
                
                document.getElementById('tokenDisplay').style.display = 'flex';
                document.getElementById('tradeSection').style.display = 'block';

                isCurrentTokenGraduated = currentBondingCurve.complete || progressPct >= 99.9;

                if (isCurrentTokenGraduated) {
                    document.getElementById('graduatedBadge').style.display = 'block';
                    document.getElementById('buyBtn').disabled = true;
                    document.getElementById('sellBtn').disabled = true;
                    document.getElementById('tradeStatus').innerHTML = `
                        <span style="color:var(--sol-green); font-weight:bold;">✅ Token Graduated (Liquidity migrated).</span><br>
                        Trade this token on: 
                        <a href="https://jup.ag/swap/SOL-${mintStr}" target="_blank" class="a">Jupiter</a> or 
                        <a href="https://raydium.io/swap/?inputCurrency=sol&outputCurrency=${mintStr}" target="_blank" class="a">Raydium</a>.
                    `;
                } else {
                    document.getElementById('graduatedBadge').style.display = 'none';
                    document.getElementById('buyBtn').disabled = false;
                    document.getElementById('sellBtn').disabled = false;
                    document.getElementById('tradeStatus').textContent = '';
                }

                if (activeImageUrl && document.getElementById('mintAddressInput').value === mintStr) {
                    document.getElementById('tokenImagePreview').src = activeImageUrl;
                } else {
                    const { data } = await supabase.from('launchpad_tokens').select('metadata_uri').eq('mint_address', mintStr).single();
                    if (data && data.metadata_uri) {
                        document.getElementById('tokenImagePreview').src = await fetchTokenImage(data.metadata_uri);
                    } else {
                        document.getElementById('tokenImagePreview').src = 'https://placehold.co/100x100/1f1f28/14F195?text=Coin';
                    }
                }

                initChartIfNeeded();
                saveChartPoint(mintStr, mcapSol);

                updateBuyQuote();
                updateSellQuote();

                if (pollingInterval) clearInterval(pollingInterval);
                pollingInterval = setInterval(() => {
                    if (currentMint && currentMint.toBase58() === mintStr) {
                        loadTokenData(mintStr);
                    }
                }, 10000);

            } catch (e) {
                console.error(e);
            }
        }

        async function updateBuyQuote() {

            try {
                const solAmount = new BN(Math.floor(solInput * LAMPORTS_PER_SOL));
                const amount = getBuyTokenAmountFromSolAmount({ global: cachedGlobal, feeConfig: cachedFeeConfig, mintSupply: currentBondingCurve.tokenTotalSupply, bondingCurve: currentBondingCurve, amount: solAmount });
                quoteEl.textContent = `${(amount.toNumber() / 1e6).toLocaleString('en-US', { maximumFractionDigits: 2 })} Tokens`;
            } catch (e) {
                quoteEl.textContent = 'Error';
            }
        }

        async function updateSellQuote() {
            const quoteEl = document.getElementById('sellQuote').querySelector('span');
            if (!currentMint || isCurrentTokenGraduated || !currentBondingCurve || !cachedGlobal) { quoteEl.textContent = '—'; return; }
            const tokenInput = parseLocaleNumber(document.getElementById('tokenAmountToSell').value);
            if (!tokenInput || tokenInput <= 0) { quoteEl.textContent = '—'; return; }

            try {
                const MAX_SAFE_CHUNK = new BN(35000000000);
                let amount = new BN(Math.floor(tokenInput * 1e6));
                
                // Clamp for quote calculation to avoid UI breaking
                let safeAmount = amount.gt(MAX_SAFE_CHUNK) ? MAX_SAFE_CHUNK : amount;
                
                const solAmount = getSellSolAmountFromTokenAmount({ global: cachedGlobal, feeConfig: cachedFeeConfig, mintSupply: currentBondingCurve.tokenTotalSupply, bondingCurve: currentBondingCurve, amount: safeAmount });
                quoteEl.textContent = `${(solAmount.toNumber() / LAMPORTS_PER_SOL).toFixed(6)} SOL${amount.gt(MAX_SAFE_CHUNK) ? ' (MAX)' : ''}`;
            } catch (e) {
                quoteEl.textContent = 'Error';
            }
        }

        document.getElementById('buyBtn').addEventListener('click', async () => {
            if (isCurrentTokenGraduated) return alert('Token graduated. Use Jupiter or Raydium.');
            const statusEl = document.getElementById('tradeStatus'); statusEl.textContent = 'Buying...'; statusEl.classList.remove('error');
            try {
                if (!currentMint) throw new Error('Load a token first.');
                const solInput = parseLocaleNumber(document.getElementById('solAmount').value);
                if (!solInput || solInput <= 0) throw new Error('Invalid SOL.');

                const solAmount = new BN(Math.floor(solInput * LAMPORTS_PER_SOL));
                const buyState = await withTimeout(onlineSdk.fetchBuyState(currentMint, userPublicKey));
                
                if (buyState.bondingCurve.complete) throw new Error('Curve completed. Go to Raydium.');

                const amount = getBuyTokenAmountFromSolAmount({ global: cachedGlobal, feeConfig: cachedFeeConfig, mintSupply: buyState.bondingCurve.tokenTotalSupply, bondingCurve: buyState.bondingCurve, amount: solAmount });
                const instructions = await onlineSdk.buyInstructions({ ...buyState, mint: currentMint, user: userPublicKey, amount, solAmount, slippage: 0.10 });

                instructions.push(ComputeBudgetProgram.setComputeUnitLimit({ units: 1000000 }), ComputeBudgetProgram.setComputeUnitPrice({ microLamports: 100000 }));

                const { blockhash, lastValidBlockHeight } = await withTimeout(connection.getLatestBlockhash('confirmed'));
                const messageV0 = new TransactionMessage({ payerKey: userPublicKey, recentBlockhash: blockhash, instructions }).compileToV0Message();
                const tx = new VersionedTransaction(messageV0);
                
                statusEl.textContent = '✍️ Sign in Phantom...';
                const signed = await wallet.signTransaction(tx);
                
                statusEl.textContent = 'Sending to network...';
                const sig = await connection.sendRawTransaction(signed.serialize());
                await withTimeout(connection.confirmTransaction({ signature: sig, blockhash, lastValidBlockHeight }, 'confirmed'), 30000);
                
                statusEl.textContent = `✅ Buy successful.`;
                
                saveTrade(currentMint.toBase58(), 'BUY', solInput, amount.toNumber() / 1e6);

                await loadTokenData(currentMint.toBase58());

            } catch (err) {

        // ==========================================
        // CLAMPED SELL LOGIC (FIXES OVERFLOW)
        // ==========================================
        document.getElementById('sellBtn').addEventListener('click', async () => {
            if (isCurrentTokenGraduated) return alert('Token graduated. Use Jupiter or Raydium.');
            const statusEl = document.getElementById('tradeStatus'); statusEl.textContent = 'Selling...'; statusEl.classList.remove('error');
            try {
                if (!currentMint) throw new Error('Load a token first.');
                const tokenInput = parseLocaleNumber(document.getElementById('tokenAmountToSell').value);
                if (!tokenInput || tokenInput <= 0) throw new Error('Invalid amount.');
                if (tokenInput > userTokenBalance) throw new Error('Insufficient token balance.');

                let amount = new BN(Math.floor(tokenInput * 1e6));
                const MAX_SAFE_CHUNK = new BN(35000000000); // ~35 Billion raw units limit

                // CLAMP LOGIC: If user asks for too much, we reduce it to the max safe amount
                if (amount.gt(MAX_SAFE_CHUNK)) {
                    amount = MAX_SAFE_CHUNK;
                    statusEl.textContent = `⚠️ Amount too large. Clamping to max safe sell (35,000 Tokens)...`;
                }

                const sellState = await withTimeout(onlineSdk.fetchSellState(currentMint, userPublicKey));
                if (sellState.bondingCurve.complete) throw new Error('Curve completed. Go to Raydium.');

                const solAmount = getSellSolAmountFromTokenAmount({ 
                    global: cachedGlobal, 
                    feeConfig: cachedFeeConfig, 
                    mintSupply: sellState.bondingCurve.tokenTotalSupply, 
                    bondingCurve: sellState.bondingCurve, 
                    amount: amount 
                });
                
                const instructions = await PUMP_SDK.sellInstructions({ 
                    ...sellState, 
                    global: cachedGlobal, 
                    feeConfig: cachedFeeConfig, 
                    mint: currentMint, 
                    user: userPublicKey, 
                    amount, 
                    solAmount, 
                    slippage: 0.15 
                });

                instructions.push(ComputeBudgetProgram.setComputeUnitLimit({ units: 1000000 }), ComputeBudgetProgram.setComputeUnitPrice({ microLamports: 100000 }));

                const { blockhash, lastValidBlockHeight } = await withTimeout(connection.getLatestBlockhash('confirmed'));
                const messageV0 = new TransactionMessage({ payerKey: userPublicKey, recentBlockhash: blockhash, instructions }).compileToV0Message();
                const tx = new VersionedTransaction(messageV0);
                
                statusEl.textContent = '✍️ Sign in Phantom...';
                const signed = await wallet.signTransaction(tx);
                
                statusEl.textContent = 'Sending to network...';
                const sig = await connection.sendRawTransaction(signed.serialize());
                await withTimeout(connection.confirmTransaction({ signature: sig, blockhash, lastValidBlockHeight }, 'confirmed'), 30000);
                
                statusEl.textContent = `✅ Sell successful.`;
                
                saveTrade(currentMint.toBase58(), 'SELL', solAmount.toNumber() / LAMPORTS_PER_SOL, amount.toNumber() / 1e6);

                await loadTokenData(currentMint.toBase58());
                await updateWalletBalance();
            } catch (err) {
                statusEl.textContent = `❌ ${err.message}`; statusEl.classList.add('error');
            }
        });
    </script>
</body>
